<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רעיונות למשחקים משפחתיים | המשפוחה</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #150c20; }
body { font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }

.lp3 {
  --bg: #150c20;
  --bg-panel: #1e1229;
  --bg-panel-2: #271735;
  --line: rgba(247,243,252,0.10);
  --ink: #f8f4fc;
  --muted: #ad9cc4;
  --muted-soft: #ceC2df;
  --purple: #8654ad;
  --purple-soft: #c3b1d6;
  --orange: #ff6a21;
  --orange-deep: #e2530f;
  --display: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  --body: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;

  position: relative;
  width: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  direction: rtl;
}

.lp3 img { max-width: 100%; display: block; }
.lp3 a { font-family: inherit; }
.lp3 ::selection { background: var(--orange); color: #1a0f0a; }

.lp3__glow { position: absolute; inset: 0; height: 760px; pointer-events: none; z-index: 0;
  background:
    radial-gradient(50% 42% at 50% 0%, rgba(134,84,173,0.34) 0%, transparent 70%),
    radial-gradient(34% 30% at 88% 10%, rgba(255,106,33,0.22) 0%, transparent 72%),
    radial-gradient(30% 26% at 8% 22%, rgba(255,106,33,0.13) 0%, transparent 72%);
}

.lp3-stars { position: absolute; inset: 0; height: 640px; pointer-events: none; z-index: 0; overflow: hidden; }
.lp3-stars--page { height: auto; }
.lp3-star { position: absolute; color: var(--orange); opacity: .3; filter: drop-shadow(0 0 6px currentColor);
  animation: lp3-twinkle 3.4s ease-in-out infinite; }
.lp3-star--purple { color: var(--purple-soft); }
@keyframes lp3-twinkle {
  0%, 100% { opacity: .18; transform: scale(.75) rotate(0deg); }
  50% { opacity: .85; transform: scale(1.15) rotate(10deg); }
}
@media (prefers-reduced-motion: reduce) { .lp3-star { animation: none; opacity: .45; } }

/* ---------- nav ---------- */
.lp3-nav {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  padding: 16px 6vw; background: rgba(21,12,32,0.72); backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
.lp3-nav__brand { display: flex; align-items: center; gap: 9px; }
.lp3-nav__brand img { width: 96px; height: auto; }
.lp3-nav__links { display: flex; align-items: center; gap: 28px; font-size: 14px; font-weight: 500; color: var(--muted-soft); }
.lp3-nav__links a { color: inherit; text-decoration: none; transition: color .15s; }
.lp3-nav__links a:hover { color: var(--ink); }
.lp3-nav__cta { display: none; }
@media (min-width: 860px) { .lp3-nav__cta { display: inline-flex; } }
@media (max-width: 760px) { .lp3-nav__links { display: none; } }
.lp3-nav__ideas { display: none; font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: none; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); }
@media (max-width: 760px) { .lp3-nav__ideas { display: inline-flex; } }

/* ---------- buttons ---------- */
.lp3-btn {
  display: inline-flex; align-items: center; gap: 9px; border-radius: 999px;
  padding: 15px 28px; font-size: 16px; font-weight: 700; border: none; cursor: pointer;
  font-family: var(--body); text-decoration: none; white-space: nowrap;
}
.lp3-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.lp3-btn--primary { background: linear-gradient(97deg, var(--orange), var(--purple)); color: #fff;
  box-shadow: 0 10px 30px rgba(255,106,33,0.28), 0 6px 20px rgba(134,84,173,0.24); }
.lp3-btn--primary:hover { filter: brightness(1.06); }
.lp3-btn--ghost { background: transparent; color: var(--ink); border: 1px solid rgba(255,255,255,0.28); }
.lp3-btn--ghost:hover { background: rgba(255,255,255,0.07); }
.lp3-btn--sm { padding: 9px 18px; font-size: 13px; }
.lp3-btn--block { width: 100%; justify-content: center; }

/* ---------- free-game banner ---------- */
.lp3-free-banner {
  position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 12px;
  padding: 12px 6vw; text-align: center; text-decoration: none; color: #fff; font-size: 15px; font-weight: 600; line-height: 1.5;
  background: linear-gradient(97deg, var(--orange-deep), var(--orange) 45%, var(--purple));
}
.lp3-free-banner strong { font-weight: 800; }
.lp3-free-banner__cta { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 800; background: rgba(21,12,32,0.35); border: 1px solid rgba(255,255,255,0.45); border-radius: 999px; padding: 5px 14px; white-space: nowrap; }
.lp3-free-banner:hover .lp3-free-banner__cta { background: rgba(21,12,32,0.55); }
.lp3-free-banner:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
.lp3-free-banner svg { flex: none; }

/* ---------- hero (real logo, centered) ---------- */
.lp3-hero { position: relative; z-index: 1; padding: 60px 7vw 36px; text-align: center; }
.lp3-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
  color: var(--orange); background: rgba(255,106,33,0.10);
  border: 1px solid rgba(255,106,33,0.32); border-radius: 999px;
  padding: 7px 16px; margin-bottom: 18px;
}
.lp3-hero__mark {
  display: block; width: clamp(240px, 26vw, 380px); height: auto; margin: 0 auto 14px;
  filter: drop-shadow(0 0 18px rgba(255,106,33,0.3)) drop-shadow(0 0 30px rgba(134,84,173,0.4));
  opacity: 0; animation: lp3-rise .7s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes lp3-rise { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce) { .lp3-hero__mark { animation: none; opacity: 1; } }
.lp3-hero__tagline { font-family: var(--display); font-weight: 700; color: var(--orange); font-size: clamp(18px, 2.2vw, 24px); margin: 0 0 14px; }
.lp3-hero__sub { font-size: 16.5px; line-height: 1.75; color: var(--muted-soft); max-width: 54ch; margin: 0 auto 30px; text-wrap: balance; }
.lp3-hero__ctas { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

/* ---------- marquee ---------- */
.lp3-marquee { position: relative; z-index: 1; overflow: hidden; background: var(--bg-panel); border-block: 1px solid var(--line); padding: 16px 0; }
.lp3-marquee__track { display: flex; gap: 40px; width: max-content; animation: lp3-scroll 32s linear infinite; }
.lp3-marquee__item { display: flex; align-items: center; gap: 40px; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; color: var(--muted-soft); white-space: nowrap; }
.lp3-marquee__item svg { color: var(--orange); flex: none; }
@keyframes lp3-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.lp3-marquee:hover .lp3-marquee__track { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .lp3-marquee__track { animation: none; } }

/* ---------- section shell ---------- */
.lp3-section { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 84px 6vw; }
.lp3-section--divider { border-top: 1px solid var(--line); }
.lp3-section--panel { max-width: none; background: var(--bg-panel); }
.lp3-section--panel > .lp3-section__inner { max-width: 1180px; margin: 0 auto; }
.lp3-kicker { display: block; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); margin: 0 0 10px; }
.lp3-h2 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3vw, 32px); text-align: center; margin: 0 0 14px; text-wrap: balance; }
.lp3-h2 em { font-style: normal; color: var(--orange); }
.lp3-sub { text-align: center; color: var(--muted-soft); max-width: 60ch; margin: 0 auto 48px; line-height: 1.75; font-size: 15.5px; }

/* ---------- features ---------- */
.lp3-features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.lp3-feature { background: var(--bg-panel-2); padding: 34px 26px; }
.lp3-feature-icon { width: 42px; height: 42px; border-radius: 12px; margin-bottom: 18px;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--gc) 18%, transparent); color: var(--gc); }
.lp3-feature h3 { font-family: var(--display); font-weight: 700; font-size: 15px; margin: 0 0 6px; }
.lp3-feature p { font-size: 14px; color: var(--muted-soft); line-height: 1.7; margin: 0; }
@media (max-width: 760px) { .lp3-features { grid-template-columns: 1fr; } }

/* ---------- steps (plain, from the original) ---------- */
.lp3-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.lp3-step { text-align: center; }
.lp3-step-num {
  width: 38px; height: 38px; border-radius: 50%; margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: #fff;
  background: linear-gradient(95deg, var(--orange), var(--purple));
}
.lp3-step h3 { font-size: 15.5px; font-weight: 700; margin: 0 0 6px; }
.lp3-step p { font-size: 13.5px; color: var(--muted-soft); line-height: 1.65; margin: 0; }
@media (max-width: 760px) { .lp3-steps { grid-template-columns: 1fr; gap: 30px; } }

/* ---------- games (photo cards, from the new one) ---------- */
.lp3-games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
.lp3-game { position: relative; border-radius: 18px; overflow: hidden; background: var(--bg-panel-2); border: 1px solid var(--line); }
.lp3-game__media { position: relative; height: 190px; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; padding: 18px 18px 0; background: linear-gradient(165deg, color-mix(in srgb, var(--gc) 26%, var(--bg-panel-2)), var(--bg-panel-2)); }
.lp3-game__media--solid { align-items: center; padding: 0; }
.lp3-game__shot { width: 94%; flex: none; border-radius: 10px 10px 0 0; overflow: hidden; box-shadow: 0 18px 34px rgba(0,0,0,0.38); background: #fff; border: 1px solid rgba(255,255,255,0.14); border-bottom: none; }
.lp3-game__shot-bar { display: flex; align-items: center; gap: 5px; padding: 8px 12px; background: #efe9f2; }
.lp3-game__shot-bar span { width: 7px; height: 7px; border-radius: 50%; background: #d7c9e3; }
.lp3-game__shot img { display: block; width: 100%; height: auto; }
.lp3-game__tag {
  position: absolute; top: 12px; left: 12px; z-index: 2; font-size: 11.5px; font-weight: 700;
  background: rgba(21,12,32,0.72); backdrop-filter: blur(6px); color: var(--gc);
  border: 1px solid color-mix(in srgb, var(--gc) 55%, transparent);
  border-radius: 999px; padding: 5px 12px;
}
.lp3-game__body { padding: 22px 24px 26px; }
.lp3-game__body h3 { font-family: var(--display); font-weight: 800; font-size: 18px; margin: 0 0 8px; }
.lp3-game__body p { font-size: 14px; color: var(--muted-soft); line-height: 1.7; margin: 0 0 16px; }
.lp3-game__pick { font-size: 13.5px; font-weight: 700; color: var(--gc); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--body); }
.lp3-game__pick:hover { text-decoration: underline; }
.lp3-game__actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.lp3-game__info-btn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--muted-soft); background: color-mix(in srgb, var(--gc) 12%, transparent); border: 1px solid color-mix(in srgb, var(--gc) 45%, var(--line)); border-radius: 999px; padding: 7px 14px; cursor: pointer; transition: background .2s ease, color .2s ease; }
.lp3-game__info-btn:hover, .lp3-game__info-btn[aria-expanded="true"] { background: color-mix(in srgb, var(--gc) 24%, transparent); color: var(--text, #fff); }
.lp3-game__info-btn svg { transition: transform .3s ease; }
.lp3-game__info-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.lp3-game__info-btn:focus-visible { outline: 2px solid var(--gc); outline-offset: 2px; }
.lp3-game__info { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.lp3-game__info.is-open { grid-template-rows: 1fr; }
.lp3-game__info > div { overflow: hidden; }
.lp3-game__info dl { margin: 0 0 16px; padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--gc) 9%, rgba(0,0,0,0.18)); border: 1px solid color-mix(in srgb, var(--gc) 28%, var(--line)); font-size: 13.5px; line-height: 1.7; }
.lp3-game__info dt { font-weight: 800; color: var(--gc); font-size: 12.5px; }
.lp3-game__info dd { margin: 0 0 8px; color: var(--muted-soft); }
.lp3-game__info dd:last-child { margin-bottom: 0; }
@media (prefers-reduced-motion: reduce) { .lp3-game__info, .lp3-game__info-btn svg { transition: none; } }
@media (max-width: 760px) { .lp3-games { grid-template-columns: 1fr; } }

/* ---------- imagine / quote ---------- */
.lp3-imagine .lp3-sub { max-width: 46ch; }
.lp3-punch { text-align: center; font-size: 18px; font-weight: 800; color: var(--orange); margin: 0 0 22px; }
.lp3-eyebrow--center { display: flex; width: fit-content; margin: 0 auto; }

/* ---------- faq ---------- */
.lp3-faq { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 900px; margin: 0 auto; }
.lp3-faq-item { background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px; }
.lp3-faq-item summary { cursor: pointer; list-style: none; font-size: 15px; font-weight: 700; padding: 17px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lp3-faq-item summary::-webkit-details-marker { display: none; }
.lp3-faq-item summary::after { content: "+"; font-size: 20px; color: var(--orange); font-weight: 400; flex: none; }
.lp3-faq-item[open] summary::after { content: "\2013"; }
.lp3-faq-item p { margin: 0 0 18px; font-size: 13.5px; color: var(--muted-soft); line-height: 1.65; }
@media (max-width: 760px) { .lp3-faq { grid-template-columns: 1fr; } }

/* ---------- pricing ---------- */
.lp3-pricing-card {
  position: relative; max-width: 480px; margin: 0 auto; text-align: center;
  background: linear-gradient(168deg, rgba(134,84,173,0.24), rgba(255,106,33,0.09));
  border: 1px solid rgba(255,255,255,0.16); border-radius: 24px; padding: 44px 34px 34px;
}
.lp3-pricing-title { font-family: var(--display); font-weight: 800; font-size: clamp(19px, 2.4vw, 23px); margin: 0 0 26px; line-height: 1.4; }
.lp3-pricing-select-wrap { text-align: right; margin: 0 0 20px; }
.lp3-pricing-label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.lp3-pricing-select {
  width: 100%; font-family: var(--body); font-size: 15px; font-weight: 600; color: var(--ink);
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); border-radius: 12px;
  padding: 13px 16px; cursor: pointer; color-scheme: dark;
}
.lp3-pricing-select:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.lp3-pricing-select option { background: var(--bg-panel-2); color: var(--ink); }
.lp3-pricing-email-wrap { text-align: right; margin: 0 0 20px; }
.lp3-pricing-email {
  width: 100%; box-sizing: border-box; font-family: var(--body); font-size: 15px; font-weight: 600; color: var(--ink);
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); border-radius: 12px;
  padding: 13px 16px; color-scheme: dark; direction: ltr; text-align: right;
}
.lp3-pricing-email::placeholder { color: var(--muted); font-weight: 500; }
.lp3-pricing-email:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.lp3-pricing-email-error { color: #ffb4a2; font-size: 13px; font-weight: 600; margin: 8px 0 0; }
.lp3-game__tag--free { left: auto; right: 12px; color: #1a0f0a; background: var(--gc); border-color: var(--gc); }
.lp3-pricing-consent { display: flex; align-items: flex-start; gap: 10px; text-align: right; font-size: 13.5px; color: var(--muted-soft); line-height: 1.6; margin: 0 0 20px; cursor: pointer; }
.lp3-pricing-consent input { flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--orange); cursor: pointer; }
.lp3-pricing-consent[hidden] { display: none; }
.lp3-pricing-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.lp3-pricing-done { font-size: 15px; font-weight: 700; color: #b9f3d6; background: rgba(47,169,138,0.16); border: 1px solid rgba(47,169,138,0.45); border-radius: 12px; padding: 14px 16px; margin: 16px 0 0; line-height: 1.6; }
.lp3-pricing-price { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--orange); margin: 16px 0 0; }
.lp3-pricing-note { font-size: 12px; color: var(--muted); margin: 16px 0 0; }
.lp3-pricing-contact { font-size: 13px; color: var(--muted-soft); margin: 18px 0 0; }
.lp3-credit { text-align: right; margin: -6px 0 20px; }
.lp3-credit__toggle { background: none; border: 0; padding: 0; font: 600 13.5px var(--body); color: var(--muted-soft); text-decoration: underline; cursor: pointer; }
.lp3-credit__row { display: flex; gap: 8px; margin-top: 10px; }
.lp3-credit__row input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .08em; direction: ltr; text-align: center; }
.lp3-credit__row button { flex: none; border: 1px solid var(--line); border-radius: 12px; padding: 0 18px; background: rgba(255,255,255,0.08); color: inherit; font: 700 14px var(--body); cursor: pointer; }
.lp3-credit__msg { font-size: 13.5px; margin: 8px 0 0; line-height: 1.5; }
.lp3-credit__msg.is-ok { color: #b9f3d6; } .lp3-credit__msg.is-bad { color: #ffb4a2; }
.lp3-pricing-price { margin-bottom: 16px; }
.lp3-pricing-price s { color: var(--muted); font-weight: 600; font-size: .75em; margin-left: 8px; }
.lp3-refer-tab {
  position: fixed; z-index: 30; left: 0; top: 46%; transform: translateY(-50%);
  display: flex; flex-direction: row; align-items: center; gap: 10px;
  padding: 16px 10px 16px 9px; border: 0; border-radius: 0 16px 16px 0; cursor: pointer;
  background: linear-gradient(180deg, var(--orange), var(--purple)); color: #fff;
  font: 800 14.5px var(--body); text-decoration: none; writing-mode: vertical-rl;
  box-shadow: 0 10px 28px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.18) inset;
  transition: transform .3s ease, opacity .3s ease, padding .2s ease;
}
.lp3-refer-tab:hover { padding-left: 14px; }
.lp3-refer-tab__icon { writing-mode: horizontal-tb; font-size: 20px; line-height: 1; animation: lp3-gift 3.2s ease-in-out infinite; }
.lp3-refer-tab__pct { writing-mode: horizontal-tb; font-size: 12px; font-weight: 800; background: rgba(21,12,32,0.35); border-radius: 999px; padding: 3px 7px; }
.lp3-refer-tab.is-away { transform: translate(-110%, -50%); opacity: 0; pointer-events: none; }
/* The vertical label reads bottom to top: keep the gift on top, the 10% at the bottom. */
.lp3-refer-tab__pct { order: 0; } .lp3-refer-tab > span:nth-child(2) { order: 1; } .lp3-refer-tab__icon { order: 2; }
@keyframes lp3-gift { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-14deg) scale(1.15); } 90% { transform: rotate(12deg) scale(1.15); } 95% { transform: rotate(-6deg); } }
@media (max-width: 760px) {
  .lp3-refer-tab { top: auto; bottom: 16px; left: 12px; transform: none; writing-mode: horizontal-tb; flex-direction: row; gap: 7px; padding: 10px 14px; border-radius: 999px; font-size: 13.5px; }
  .lp3-refer-tab:hover { padding-left: 14px; }
  .lp3-refer-tab.is-away { transform: translateY(140%); }
  .lp3-refer-tab__icon { font-size: 17px; }
  .lp3-refer-tab__pct, .lp3-refer-tab > span:nth-child(2), .lp3-refer-tab__icon { order: 0; }
}
@media (prefers-reduced-motion: reduce) { .lp3-refer-tab__icon { animation: none; } .lp3-refer-tab { transition: none; } }
.lp3-refer-perks { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 10px; text-align: right; }
.lp3-refer-perks li { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); font-size: 15px; line-height: 1.5; }
.lp3-refer-perks b { flex: none; min-width: 64px; text-align: center; font-family: var(--display); font-size: 20px; color: var(--orange); }
.lp3-refer-link { display: flex; gap: 8px; margin: 0 0 10px; }
.lp3-refer-link input { flex: 1; min-width: 0; direction: ltr; text-align: left; font-size: 14px; }
.lp3-refer-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.lp3-refer-actions > * { flex: 1 1 160px; }
.lp3-refer-fine { font-size: 12px; color: var(--muted); margin: 18px 0 0; line-height: 1.6; }
.lp3-pricing-contact a { color: var(--orange); }


@media (prefers-reduced-motion: reduce) { .lp3 * { animation-duration: 0.001ms !important; } }


/* ---------- scroll-reveal: varied per section, not one repeated effect ---------- */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s cubic-bezier(.16,.8,.24,1), transform .7s cubic-bezier(.16,.8,.24,1); }
.reveal.is-visible { opacity: 1; transform: translateY(0); }
.reveal-d1 { transition-delay: .12s; }
.reveal-d2 { transition-delay: .24s; }
.reveal-d3 { transition-delay: .36s; }

/* hero eyebrow + imagine eyebrow: pop in rather than rise */
.reveal-pop { opacity: 0; transform: scale(.72); transition: opacity .5s ease, transform .55s cubic-bezier(.34,1.56,.64,1); }
.reveal-pop.is-visible { opacity: 1; transform: scale(1); }

/* about section: alternating slide from each side, icon pops after */
.reveal-slide-l, .reveal-slide-r { opacity: 0; transition: opacity .65s ease, transform .65s cubic-bezier(.16,.8,.24,1); }
.reveal-slide-l { transform: translateX(-46px); }
.reveal-slide-r { transform: translateX(46px); }
.reveal-slide-l.is-visible, .reveal-slide-r.is-visible { opacity: 1; transform: translateX(0); }
.reveal-slide-l .lp3-feature-icon, .reveal-slide-r .lp3-feature-icon { transform: scale(0) rotate(-25deg); transition: transform .45s cubic-bezier(.34,1.56,.64,1) .25s; }
.reveal-slide-l.is-visible .lp3-feature-icon, .reveal-slide-r.is-visible .lp3-feature-icon { transform: scale(1) rotate(0deg); }

/* faq: smaller alternating slide */
.reveal-slide-l-sm, .reveal-slide-r-sm { opacity: 0; transition: opacity .55s ease, transform .55s cubic-bezier(.16,.8,.24,1); }
.reveal-slide-l-sm { transform: translateX(-18px); }
.reveal-slide-r-sm { transform: translateX(18px); }
.reveal-slide-l-sm.is-visible, .reveal-slide-r-sm.is-visible { opacity: 1; transform: translateX(0); }

/* steps: numbers pop in on a connecting line that draws across */
.reveal-line { position: relative; }
.reveal-line::before {
  content: ""; position: absolute; top: 19px; left: 12.5%; right: 12.5%; height: 2px;
  background: linear-gradient(90deg, var(--purple), var(--orange));
  transform-origin: right center; transform: scaleX(0);
  transition: transform 1.1s cubic-bezier(.16,.8,.24,1) .15s;
}
.reveal-line.is-visible::before { transform: scaleX(1); }
@media (max-width: 760px) { .reveal-line::before { display: none; } }
.reveal-step { opacity: 0; transition: opacity .5s ease .1s; transition-delay: calc(var(--i, 1) * .12s); }
.reveal-step.is-visible { opacity: 1; }
.reveal-step .lp3-step-num { position: relative; z-index: 1; transform: scale(0) rotate(-90deg); transition: transform .5s cubic-bezier(.34,1.56,.64,1); transition-delay: calc(var(--i, 1) * .12s); }
.reveal-step.is-visible .lp3-step-num { transform: scale(1) rotate(0deg); }
.reveal-step h3, .reveal-step p { opacity: 0; transform: translateY(10px); transition: opacity .5s ease, transform .5s ease; transition-delay: calc(var(--i, 1) * .12s + .2s); }
.reveal-step.is-visible h3, .reveal-step.is-visible p { opacity: 1; transform: translateY(0); }

/* games catalog: dealt onto the table, each tilted a different way */
.reveal-wipe { opacity: 0; transform: translateY(38px); transition: opacity .55s ease calc(var(--i, 1) * .1s), transform .7s cubic-bezier(.34,1.3,.5,1) calc(var(--i, 1) * .1s); }
.reveal-wipe.is-visible { opacity: 1; transform: translateY(0); }
.reveal-wipe .lp3-game__shot { transform: translateY(22px); transition: transform .75s cubic-bezier(.16,.8,.24,1) calc(var(--i, 1) * .1s + .12s); }
.reveal-wipe.is-visible .lp3-game__shot { transform: translateY(0); }
.lp3-game.is-visible { transition: transform .35s ease, box-shadow .35s ease; }
.lp3-game.is-visible:hover { transform: translateY(-7px); box-shadow: 0 22px 40px rgba(0,0,0,0.4); }

/* punch line already uses reveal-pop; pricing card: scale in + one-shot glow pulse */
.reveal-scale { opacity: 0; transform: scale(.92); transition: opacity .8s ease, transform .8s cubic-bezier(.16,.8,.24,1); }
.reveal-scale.is-visible { opacity: 1; transform: scale(1); animation: lp3-pulse-glow 2.2s ease-out .7s 1; }
@keyframes lp3-pulse-glow {
  0% { box-shadow: 0 0 0 0 rgba(255,106,33,0); }
  35% { box-shadow: 0 0 46px 8px rgba(255,106,33,.32); }
  100% { box-shadow: 0 0 0 0 rgba(255,106,33,0); }
}

.lp3-feature-icon { transition: transform .35s ease; }
.lp3-feature:hover .lp3-feature-icon { transform: scale(1.1) rotate(-4deg); }
.lp3-faq-item { transition: border-color .3s ease; }
.lp3-faq-item:hover { border-color: color-mix(in srgb, var(--purple) 45%, var(--line)); }

@media (prefers-reduced-motion: reduce) {
  .reveal, .reveal-pop, .reveal-slide-l, .reveal-slide-r, .reveal-slide-l-sm, .reveal-slide-r-sm,
  .reveal-step, .reveal-step .lp3-step-num, .reveal-step h3, .reveal-step p, .reveal-wipe, .reveal-scale,
  .reveal-line::before {
    opacity: 1; transform: none; transition: none; animation: none;
  }
  .lp3-game:hover, .lp3-feature:hover .lp3-feature-icon { transform: none; }
}

<script>
(function () {
  var list = document.getElementById('ideas');
  var ideas = window.IDEAS || [];
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  ideas.forEach(function (it, i) {
    var card = el('article', 'idea reveal');
    var head = el('button', 'idea__head'); head.type = 'button'; head.setAttribute('aria-expanded', 'false');
    head.appendChild(el('span', 'idea__num', String(i + 1)));
    var txt = el('span'); txt.appendChild(el('h3', 'idea__title', it.title)); if (it.badge) txt.appendChild(el('span', 'idea__badge', it.badge)); head.appendChild(txt);
    var chev = el('span', 'idea__chev'); chev.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'; head.appendChild(chev);
    card.appendChild(head);
    if (it.needs) { var nd = el('p', 'idea__needs'); nd.appendChild(el('b', null, 'מה צריך? ')); nd.appendChild(document.createTextNode(it.needs)); card.appendChild(nd); }
    var body = el('div', 'idea__body'), wrap = el('div'), inner = el('div', 'idea__inner');
    (it.sections || []).forEach(function (sec) {
      var box = el('section', 'idea__sec'); box.appendChild(el('h4', null, sec.title));
      (sec.text || []).forEach(function (s) { box.appendChild(el('p', null, s)); });
      if (sec.list && sec.list.length) { if (sec.listTitle) box.appendChild(el('p', 'idea__lt', sec.listTitle)); var ul = el('ul'); sec.list.forEach(function (s) { ul.appendChild(el('li', null, s)); }); box.appendChild(ul); }
      (sec.after || []).forEach(function (s) { box.appendChild(el('p', null, s)); });
      inner.appendChild(box);
    });
    wrap.appendChild(inner); body.appendChild(wrap); card.appendChild(body);
    head.addEventListener('click', function () { var open = card.classList.toggle('is-open'); head.setAttribute('aria-expanded', open ? 'true' : 'false'); });
    list.appendChild(card);
  });
})();
</script>
<script>
(function () {
  var selector = '.reveal, .reveal-pop, .reveal-slide-l, .reveal-slide-r, .reveal-slide-l-sm, .reveal-slide-r-sm, .reveal-line, .reveal-step, .reveal-wipe, .reveal-scale';
  var els = document.querySelectorAll(selector);
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || !('IntersectionObserver' in window)) {
    els.forEach(function (el) { el.classList.add('is-visible'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
  els.forEach(function (el) { io.observe(el); });

  // failsafe: nothing may stay invisible. If an element hasn't revealed shortly
  // after it should have, show it anyway.
  setTimeout(function () {
    els.forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) { el.classList.add('is-visible'); }
    });
  }, 2500);
  window.addEventListener('load', function () {
    setTimeout(function () {
      els.forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) { el.classList.add('is-visible'); }
      });
    }, 400);
  });
})();
</script>
