/* ==== Mini design system (buttons/inputs/modal/table/...) — matches Client/src/theme/*.ts ==== */
/* ============================================================================
   Design tokens — extracted verbatim from the app's theme (Client/src/theme/*.ts)
   and Mantine's fixed per-color derivation (filled=shade6, filled-hover=shade7,
   light=shade1, light-color=shade9), so the two bespoke game CSS files below
   (which reference --mantine-color-* directly) render identically to the app.
   ============================================================================ */
:root {
  --mantine-color-brandPurple-0: #F8F5FC;
  --mantine-color-brandPurple-1: #EDE5F5;
  --mantine-color-brandPurple-2: #DDCCEA;
  --mantine-color-brandPurple-3: #C9AFDC;
  --mantine-color-brandPurple-4: #B190CE;
  --mantine-color-brandPurple-5: #9973BE;
  --mantine-color-brandPurple-6: #7A4FA3;
  --mantine-color-brandPurple-7: #6B4491;
  --mantine-color-brandPurple-8: #5A3A78;
  --mantine-color-brandPurple-9: #3E2856;

  --mantine-color-accent-0: #FFF3EC;
  --mantine-color-accent-1: #FFE4D3;
  --mantine-color-accent-2: #FFC9A8;
  --mantine-color-accent-3: #FFAA79;
  --mantine-color-accent-4: #FF8A4D;
  --mantine-color-accent-5: #FF7A34;
  --mantine-color-accent-6: #FF6A21;
  --mantine-color-accent-7: #E85A16;
  --mantine-color-accent-8: #C64A10;
  --mantine-color-accent-9: #9C3A0C;

  --mantine-color-neutral-0: #FFFFFF;
  --mantine-color-neutral-1: #F8F8FA;
  --mantine-color-neutral-2: #F0EEF3;
  --mantine-color-neutral-3: #E6E2EB;
  --mantine-color-neutral-4: #D3CEDA;
  --mantine-color-neutral-5: #B3ADBC;
  --mantine-color-neutral-6: #8F8898;
  --mantine-color-neutral-7: #6F6878;
  --mantine-color-neutral-8: #4C4653;
  --mantine-color-neutral-9: #2F2A36;

  --mantine-color-red-0: #fff5f5;
  --mantine-color-red-1: #ffe3e3;
  --mantine-color-red-4: #ff8787;
  --mantine-color-red-5: #ff6b6b;
  --mantine-color-red-6: #fa5252;
  --mantine-color-red-7: #f03e3e;
  --mantine-color-red-8: #e03131;

  --mantine-color-green-0: #ebfbee;
  --mantine-color-green-6: #40c057;
  --mantine-color-green-7: #37b24d;
  --mantine-color-green-8: #2f9e44;

  --mantine-font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --shadow-sm: 0 1px 3px rgba(47, 42, 54, 0.06);
  --shadow-md: 0 6px 16px rgba(47, 42, 54, 0.08);
  --shadow-lg: 0 16px 40px rgba(47, 42, 54, 0.14);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--mantine-color-neutral-1);
  color: var(--mantine-color-neutral-9);
  font-family: var(--mantine-font-family);
  font-size: 16px;
  line-height: 1.55;
}
body { min-height: 100vh; }
button { font: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.25; }
p { margin: 0; }
img { max-width: 100%; display: block; }

.ui-shell {
  max-width: 760px;
  margin: 0 auto;
  padding: var(--space-xl) var(--space-md) 60px;
}
.ui-shell--wide { max-width: 980px; }

.ui-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  padding: 10px var(--space-md);
  max-width: 980px;
  margin: 0 auto;
}
.ui-topbar-brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  color: var(--mantine-color-brandPurple-7);

}

.ui-stack { display: flex; flex-direction: column; }
.ui-stack > * + * { margin-top: var(--space-md); }
.ui-stack--xs > * + * { margin-top: var(--space-xs); }
.ui-stack--sm > * + * { margin-top: var(--space-sm); }
.ui-stack--lg > * + * { margin-top: var(--space-lg); }

.ui-group--end { justify-content: flex-end; }

.ui-paper {

  padding: var(--space-lg);
}

.ui-text-dimmed { color: var(--mantine-color-neutral-6); font-size: 14px; }
.ui-text-sm { font-size: 14px; }
.ui-text-center { text-align: center; }

.ui-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 38px;
  padding: 0 20px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;

}
.ui-btn:hover:not(:disabled) { background: var(--mantine-color-brandPurple-7); }
.ui-btn:active:not(:disabled) { transform: translateY(1px); }

.ui-btn--light { background: var(--mantine-color-brandPurple-1); color: var(--mantine-color-brandPurple-9); }

.ui-btn--subtle { background: transparent; color: var(--mantine-color-brandPurple-6); }
.ui-btn--subtle:hover:not(:disabled) { background: var(--mantine-color-brandPurple-1); }
.ui-btn--danger { background: var(--mantine-color-red-6); }
.ui-btn--danger:hover:not(:disabled) { background: var(--mantine-color-red-7); }
.ui-btn--sm { height: 32px; padding: 0 14px; font-size: 13px; }
.ui-btn--block { width: 100%; }
.ui-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 999px;

.ui-field { display: flex; flex-direction: column; gap: 4px; }
.ui-field-label { font-size: 13px; font-weight: 600; color: var(--mantine-color-neutral-8); }
.ui-field-desc { font-size: 12px; color: var(--mantine-color-neutral-6); }
.ui-input {
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--mantine-color-neutral-4);

.ui-input:focus {

.ui-switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.ui-switch-track {

  height: 22px;
  border-radius: 999px;
  background: var(--mantine-color-neutral-4);
  transition: background 0.15s ease;

}
.ui-switch-thumb {
  position: absolute;
  top: 2px;
  inset-inline-start: 2px;
  width: 18px;
  height: 18px;

.ui-badge {

.ui-pill {

.ui-pill-remove {

.ui-avatar {

.ui-alert {

/* ============================================================================
   Standalone-only adaptation: the original .pg__player-col--selected only ever
   changes the name text's color/weight (see PersonalityGamePlay.css) — too subtle
   to register at a glance during real play. This adds a ring on the avatar itself
   plus a small checkmark badge, without touching the copied game CSS above.
   (A rectangular chip background/frame around the whole column was tried first
   and dropped — it read as a boxy outline rather than "this person is selected".)
   pg-badge-pop is reused from PersonalityGamePlay.css (same pop used for the
   guess-outcome badge) — @keyframes don't need to precede their use. The badge
   sits at the ring's opposite corner from the leader crown so the two never
   collide even when one player is both selected and in the lead. */
.pg__player-col--selected .pg__player-avatar-ring {
  box-shadow: 0 0 0 3px var(--mantine-color-brandPurple-6), 0 3px 8px color-mix(in srgb, var(--mantine-color-brandPurple-6) 35%, transparent);
}
.pg__player-selected-badge {
  position: absolute;
  bottom: -2px;
  inset-inline-start: -2px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 999px;
  background: var(--mantine-color-brandPurple-6);
  color: #fff;
  box-shadow: 0 0 0 2px #fff, 0 2px 5px color-mix(in srgb, var(--mantine-color-brandPurple-6) 40%, transparent);
  animation: pg-badge-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Revealed board card with a photo: let the photo fill the whole card (poster-style) instead of
   the small cropped circle avatar — the circle read as an afterthought once you could actually
   see who it was. Only applies once a window is open AND the character has a photo; every other
   card (closed, or open with no photo) keeps the original circle-avatar layout untouched.
   ".pg__card.pg__card--photo" (two classes) is deliberate, not decorative — PersonalityGamePlay
   .css's board-density tiers (.pg__board--dense .pg__card, etc.) also carry two classes' worth
   of specificity and are defined later in the stylesheet, so a single-class override here would
   silently lose the padding fight on any board denser than "sparse". */
.pg__card.pg__card--photo {
  padding: 0;
}
.pg__card-photo-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.pg__card--photo .pg__card-number {
  z-index: 2;
}
.pg__card-photo-overlay {
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 34px 10px 12px;
  background: linear-gradient(to top, rgba(28, 14, 40, 0.84) 0%, rgba(28, 14, 40, 0.5) 55%, transparent 100%);
}
.pg__card-photo-overlay .pg__card-name {
  color: #fff;
}
.pg__card-photo-overlay .pg__clue-list {
  border-top-color: rgba(255, 255, 255, 0.35);
}

/* Closed-card mystery mark: a bare "?" glyph, no circle/ring chrome (that read as an empty
   placeholder rather than a mystery). Sized per board density to match how big the old circular
   avatar used to read at each tier. */
.pg__card-mystery {
  font-weight: 800;
  line-height: 1;
  color: var(--mantine-color-brandPurple-4);
  font-size: 40px;
}
.pg__board--cozy .pg__card-mystery { font-size: 34px; }
.pg__board--dense .pg__card-mystery { font-size: 28px; }
.pg__board--compact .pg__card-mystery { font-size: 22px; }
.pg__board--tight .pg__card-mystery { font-size: 18px; }
.pg__board--micro .pg__card-mystery { font-size: 15px; }

/* Small "?" help button (content manager topbar + play screen header) opening the instructions
   modal, and the modal's own content styling. */
.ui-help-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;

.ui-instructions-modal { max-width: 560px; }
.ui-instructions {

}
.ui-instructions h4 {

/* ==== Verbatim from Client/src/pages/Game/Personality/PersonalityGamePlay.css ==== */
/*
 * Personality game screen — "bright & vibrant" art direction, deliberately reusing the Home
 * page's visual devices (gradient text, glow, glass panels, colorful pills, playful tilt) but
 * on a bright ground instead of Home's dark hero, since this is a screen people actually play
 * on rather than a one-off marketing moment. Breaks out of GameLayout's centered
 * <Container py="xl"> both horizontally (100vw + negative inline margin) and vertically
 * (negative block margin cancels the Container's 32px top/bottom padding) so the screen can
 * claim the full viewport below the 48px header, like a table you sit down at rather than a
 * page you scroll.
 */

.pg {
  --pg-header-h: 48px;
  --pg-container-py: 32px;
  position: relative;
  width: 100vw;
  margin-inline: calc(50% - 50vw);
  margin-block: calc(var(--pg-container-py) * -1);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - var(--pg-header-h));
  padding: 18px clamp(16px, 3vw, 40px) 20px;
  background: linear-gradient(180deg, #fffaf5 0%, #fbf6ff 45%, #f7f1ff 100%);
}
/* atmosphere: soft color blooms in the corners, like Home's hero glow — kept as a
   pseudo-element (not extra DOM) so components stay untouched. */
.pg::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(38% 34% at 8% 6%, color-mix(in srgb, var(--mantine-color-accent-6) 16%, transparent) 0%, transparent 70%),
    radial-gradient(42% 38% at 94% 8%, color-mix(in srgb, var(--mantine-color-brandPurple-6) 18%, transparent) 0%, transparent 70%),
    radial-gradient(55% 42% at 50% 108%, color-mix(in srgb, var(--mantine-color-accent-4) 14%, transparent) 0%, transparent 70%);
}
.pg__header,
.pg__stage {
  position: relative;
  z-index: 1;
}

/* ---------- header: eyebrow + gradient wordmark + glowing round pill ---------- */
.pg__header {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  /* Shares .pg__stage's max-width so header/toolbar/board read as one composition
     (mirrors MemoryMatch's single consistent column), sized wider than MemoryMatch's
     ~900px since a Personality board can hold up to 50 cards. */
  max-width: 1700px;
  width: 100%;
  margin: 0 auto 12px;
}
.pg__header-title {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.pg__eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--mantine-color-accent-8);
}
.pg__eyebrow svg {
  color: var(--mantine-color-accent-6);
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--mantine-color-accent-6) 55%, transparent));
}
.pg__header-name {
  line-height: 1.15;
  font-weight: 800 !important;
  letter-spacing: -0.01em;
  background: linear-gradient(100deg, var(--mantine-color-brandPurple-6) 0%, var(--mantine-color-accent-8) 55%, var(--mantine-color-accent-4) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.pg__header-actions {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
}
.pg__round-pill {
  display: inline-flex;
  align-items: center;
  height: 34px;
  padding: 0 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(95deg, var(--mantine-color-accent-6), var(--mantine-color-brandPurple-6));
  box-shadow: 0 10px 22px color-mix(in srgb, var(--mantine-color-brandPurple-6) 30%, transparent), 0 6px 14px color-mix(in srgb, var(--mantine-color-accent-6) 24%, transparent);
  white-space: nowrap;
}
.pg__round-pill--paused {
  color: var(--mantine-color-neutral-7);
  background: var(--mantine-color-neutral-2);
  box-shadow: none;
}
.pg__pause-btn {
  background: #fff !important;
  box-shadow: 0 6px 16px color-mix(in srgb, var(--mantine-color-brandPurple-6) 20%, transparent);
  transition: transform 0.15s ease, box-shadow 0.15s ease !important;
}
.pg__pause-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 22px color-mix(in srgb, var(--mantine-color-brandPurple-6) 26%, transparent);
}

/* ---------- board-first stage: a vertical stack, board claims the leftover space ---------- */
.pg__stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 1700px;
  width: 100%;
  margin: 0 auto;
}

.pg__stage--paused {
  opacity: 0.55;
  pointer-events: none;
  filter: grayscale(0.2);
  transition: opacity 0.2s ease;
}

/* ---------- toolbar: one glassy card grouping players + questions + the guess hint,
   so they read as a single cohesive control bar instead of three stacked sections ---------- */
.pg__toolbar {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: color-mix(in srgb, #fff 72%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, #fff 90%, transparent);
  border-radius: 16px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 10px 22px color-mix(in srgb, var(--mantine-color-brandPurple-6) 8%, transparent);
  padding: 10px 14px;
}
/* Row never wraps: the players zone wraps its own chips internally, and the questions
   zone scrolls horizontally — so the two zones always stay side by side. Headroom for the
   turn badge lives here (once, shared) rather than on the player zone alone, so the
   players and questions zones start from the same baseline instead of drifting apart. */
.pg__toolbar-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-top: 8px;
}
.pg__toolbar-divider {
  flex: none;
  align-self: center;
  width: 1px;
  height: 24px;
  background: color-mix(in srgb, var(--mantine-color-brandPurple-6) 18%, transparent);
}
.pg__toolbar-hint {
  font-size: 11.5px;
  color: var(--mantine-color-brandPurple-6);
  line-height: 1.4;
  margin: 0;
}

/* ---------- questions: a small inline label + compact horizontal scroll strip ---------- */
.pg__toolbar-questions {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.pg__toolbar-label {
  flex: none;
  font-size: 12px;
  font-weight: 800;
  color: var(--mantine-color-brandPurple-8);
}

/* ---------- players: small avatar+caption portraits, not pill controls — people in the
   room, not navigation buttons. Turn/leader live on the avatar (ring + corner badge),
   selection lives on the name text color, so the three states never visually collide. ---------- */
.pg__player-chip-row {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  align-items: flex-start;
  justify-content: center;
  gap: 10px;
  max-height: 96px;
  overflow-y: auto;
}
.pg__player-col {
  position: relative;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 3px 5px;
  border-radius: 10px;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}
.pg__player-col:hover {
  background: var(--mantine-color-neutral-1);
}
.pg__player-col:active {
  transform: scale(0.96);
}
.pg__player-avatar-ring {
  position: relative;
  display: flex;
  border-radius: 999px;
}
.pg__player-chip-avatar {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 11px;
  color: #fff;
  background: linear-gradient(135deg, var(--mantine-color-accent-4), var(--mantine-color-brandPurple-6));
}
/* text-overflow:ellipsis needs its own block box, not the flex column itself. */
.pg__player-name-text {
  display: block;
  min-width: 0;
  max-width: 72px;
  font-size: 11px;
  font-weight: 700;
  color: var(--mantine-color-neutral-8);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.15s ease;
}
/* Selection is the one state that lives on the name, not the avatar — the avatar is
   already reserved for turn (ring) + leader (badge), so all three stay legible together. */
.pg__player-col--selected .pg__player-name-text {
  color: var(--mantine-color-brandPurple-7);
  font-weight: 800;
}
.pg__player-crown-badge {
  position: absolute;
  top: -2px;
  inset-inline-end: -2px;
  color: var(--mantine-color-accent-7);
  background: #fff;
  border-radius: 999px;
  padding: 1px;
  filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--mantine-color-accent-6) 45%, transparent));
  animation: pg-crown-sway 3.6s ease-in-out infinite;
}

/* Current turn: a thin colored ring hugging the avatar circle — a highlight, not a
   separate floating tag. */
.pg__player-avatar-ring--turn {
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--mantine-color-brandPurple-6) 45%, transparent);
  animation: pg-turn-ring-pulse 2.2s ease-in-out infinite;
}
@keyframes pg-turn-ring-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--mantine-color-brandPurple-6) 40%, transparent);
  }
  50% {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--mantine-color-brandPurple-6) 55%, transparent);
  }
}
.pg__player-chip-score {
  font-size: 10.5px;
  color: var(--mantine-color-neutral-6);
  font-weight: 600;
  white-space: nowrap;
}
.pg__player-score--flash {
  animation: pg-score-pulse 0.5s ease-out;
}
.pg__player-float {
  position: absolute;
  top: -6px;
  inset-inline-end: -6px;
  font-size: 11px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 999px;
  pointer-events: none;
  animation: pg-float-rise 1.4s ease-out forwards;
}
.pg__player-float--gain {
  color: #1a7d4a;
  background: #e4f7ec;
}
.pg__player-float--lose {
  color: var(--mantine-color-accent-8);
  background: var(--mantine-color-accent-0);
}

/* density tiers — the row shrinks itself so it never needs to scroll for a typical group */
.pg__player-chip-row--cozy {
  gap: 8px;
}
.pg__player-chip-row--cozy .pg__player-chip-avatar {
  width: 24px;
  height: 24px;
  font-size: 10.5px;
}
.pg__player-chip-row--cozy .pg__player-name-text {
  font-size: 10.5px;
  max-width: 64px;
}
.pg__player-chip-row--cozy .pg__player-chip-score {
  font-size: 10px;
}
.pg__player-chip-row--dense {
  gap: 7px;
}
.pg__player-chip-row--dense .pg__player-chip-avatar {
  width: 22px;
  height: 22px;
  font-size: 10px;
}
.pg__player-chip-row--dense .pg__player-name-text {
  font-size: 10px;
  max-width: 58px;
}
.pg__player-chip-row--dense .pg__player-chip-score {
  font-size: 9.5px;
}
.pg__player-chip-row--compact {
  gap: 6px;
}
.pg__player-chip-row--compact .pg__player-chip-avatar {
  width: 20px;
  height: 20px;
  font-size: 9.5px;
}
.pg__player-chip-row--compact .pg__player-name-text {
  font-size: 9.5px;
  max-width: 52px;
}
.pg__player-chip-row--compact .pg__player-chip-score {
  font-size: 9px;
}

/* No engine cap on question count (only characters are capped, at 50), so this stays a
   fixed-height horizontal scroll rather than wrapping — a wrapping strip could grow
   unpredictably tall as a moderator adds questions, eating into the toolbar's height. */
.pg__question-list {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 8px;
  list-style: none;
  margin: 0;
  padding: 2px 2px 8px;
}
.pg__question-list > li {
  flex: none;
}
.pg__question-btn {
  flex: none;
  white-space: nowrap;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  border: none;
  cursor: pointer;
  text-align: right;
  border-radius: 999px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  color: var(--mantine-color-brandPurple-8);
  background: linear-gradient(160deg, #fff, var(--mantine-color-brandPurple-0));
  box-shadow: 0 2px 8px color-mix(in srgb, var(--mantine-color-brandPurple-6) 8%, transparent);
  transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow 0.15s ease, opacity 0.35s ease;
}
.pg__question-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px color-mix(in srgb, var(--mantine-color-brandPurple-6) 16%, transparent);
}
.pg__question-btn:active:not(:disabled) {
  transform: translateY(0) scale(0.98);
  box-shadow: 0 2px 6px color-mix(in srgb, var(--mantine-color-brandPurple-6) 10%, transparent);
}
.pg__question-btn:focus-visible {
  outline: 2px solid var(--mantine-color-brandPurple-4);
  outline-offset: 2px;
}
.pg__question-btn:disabled {
  opacity: 0.4;
  cursor: default;
  text-decoration: line-through;
  box-shadow: none;
  transform: none;
}
.pg__question-empty {
  flex: none;
  white-space: nowrap;
  font-size: 11.5px;
  color: var(--mantine-color-brandPurple-6);
  padding: 0 4px;
  margin: 0;
}

/* ---------- the board: a glowing glass table the cards float on ---------- */
.pg__board-panel {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}
.pg__table {
  position: relative;
  height: 100%;
  box-sizing: border-box;
  border-radius: 28px;
  border: 1px solid color-mix(in srgb, #fff 90%, transparent);
  background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, #fff 92%, transparent) 0%, color-mix(in srgb, #fff 58%, transparent) 60%, color-mix(in srgb, #fff 38%, transparent) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 26px 50px color-mix(in srgb, var(--mantine-color-brandPurple-6) 12%, transparent);
  padding: clamp(16px, 2.6vw, 32px);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Grid (not flex-wrap) so card width is the browser dividing the *actual available width*
   by --cols, rather than a fixed px value keyed only off item count — the same card count
   now genuinely renders larger in a wider container. */
.pg__board {
  display: grid;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
  align-content: center;
  gap: clamp(8px, 1.4vw, 24px);
  width: 100%;
}

/* ---------- cards: playful premium collectible cards ---------- */
.pg__card {
  position: relative;
  min-height: 214px;
  border-radius: 22px;
  border: 2px solid transparent;
  background: linear-gradient(160deg, #fff 0%, var(--mantine-color-accent-0) 100%);
  box-shadow: 0 2px 4px color-mix(in srgb, var(--mantine-color-brandPurple-6) 6%, transparent), 0 16px 30px color-mix(in srgb, var(--mantine-color-brandPurple-6) 12%, transparent);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 22px 14px 18px;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow 0.25s ease;
}
.pg__card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 2px;
  pointer-events: none;
  background: linear-gradient(135deg, color-mix(in srgb, var(--mantine-color-accent-6) 55%, transparent), color-mix(in srgb, var(--mantine-color-brandPurple-6) 55%, transparent));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0.55;
}
.pg__card:nth-child(odd):not(.pg__card--open) {
  transform: rotate(-1.3deg);
}
.pg__card:nth-child(even):not(.pg__card--open) {
  transform: rotate(1.1deg);
}
.pg__card:hover:not(:disabled) {
  transform: translateY(-6px) rotate(0deg) scale(1.02);
  box-shadow: 0 6px 14px color-mix(in srgb, var(--mantine-color-brandPurple-6) 13%, transparent), 0 28px 46px color-mix(in srgb, var(--mantine-color-brandPurple-6) 26%, transparent);
}
.pg__card:active:not(:disabled) {
  transform: translateY(-1px) scale(0.97);
  transition-duration: 0.08s;
}
.pg__card:disabled {
  cursor: default;
}

.pg__card-sheen {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(115deg, rgba(255, 255, 255, 0.6) 0%, transparent 30%);
}

.pg__card--open {
  cursor: default;
  background: linear-gradient(165deg, #fff 0%, var(--mantine-color-accent-0) 55%, var(--mantine-color-brandPurple-0) 135%);
}
.pg__card--open::before {
  opacity: 0.9;
}
.pg__card--open:hover {
  transform: none;
  box-shadow: 0 2px 4px color-mix(in srgb, var(--mantine-color-brandPurple-6) 6%, transparent), 0 16px 30px color-mix(in srgb, var(--mantine-color-brandPurple-6) 12%, transparent);
}

.pg__card--revealing {
  animation:
    pg-card-flip 0.6s cubic-bezier(0.3, 0.7, 0.4, 1),
    pg-card-bounce 0.3s ease-out 0.6s,
    pg-card-glow 1s ease-out 0.6s;
}

.pg__card-avatar {
  position: relative;
  width: 60px;
  height: 60px;
  border-radius: 999px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: var(--mantine-color-brandPurple-6);
  font-weight: 800;
  font-size: 20px;
  flex: none;
  box-shadow: 0 0 0 3px #fff, 0 0 0 5px color-mix(in srgb, var(--mantine-color-brandPurple-6) 28%, transparent), 0 6px 14px color-mix(in srgb, var(--mantine-color-brandPurple-6) 18%, transparent);
}
.pg__card--open .pg__card-avatar {
  color: #fff;
  background: linear-gradient(135deg, var(--mantine-color-accent-6), var(--mantine-color-brandPurple-6));
  box-shadow: 0 0 0 3px #fff, 0 0 0 5px color-mix(in srgb, var(--mantine-color-accent-6) 35%, transparent), 0 8px 16px color-mix(in srgb, var(--mantine-color-accent-6) 25%, transparent);
}
.pg__card-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.pg__card-name {
  font-size: 15.5px;
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--mantine-color-brandPurple-9);
  text-align: center;
  line-height: 1.3;
}
.pg__card-value {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(150deg, var(--mantine-color-accent-4), var(--mantine-color-brandPurple-6));
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 6px 14px color-mix(in srgb, var(--mantine-color-brandPurple-6) 30%, transparent);
}
.pg__card-value-num {
  font-size: 15px;
  font-weight: 800;
  line-height: 1;
}
.pg__card-value-unit {
  font-size: 8px;
  font-weight: 600;
  opacity: 0.9;
  margin-top: 1px;
}

/* Permanent card number — always visible in the top-right corner (both closed and
   revealed) so players can call out "card 7" without ambiguity. inset-inline-start
   resolves to the visual right under this app's global dir="rtl", matching the
   existing corner-placement convention used by .pg__player-float. */
.pg__card-number {
  position: absolute;
  top: 10px;
  inset-inline-start: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  color: #fff;
  background: linear-gradient(135deg, var(--mantine-color-accent-6), var(--mantine-color-brandPurple-6));
  box-shadow: 0 2px 6px color-mix(in srgb, var(--mantine-color-brandPurple-6) 30%, transparent);
}

.pg__clue-list {
  width: 100%;
  list-style: none;
  margin: 4px 0 0;
  padding: 9px 0 0;
  border-top: 1px dashed color-mix(in srgb, var(--mantine-color-brandPurple-6) 22%, transparent);
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  justify-content: center;
  gap: 5px;
  min-height: 0;
  overflow-y: auto;
}
.pg__clue-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
  padding: 3px 8px 3px 6px;
  border-radius: 999px;
  animation: pg-clue-in 0.35s ease;
  white-space: nowrap;
}
.pg__clue-chip svg {
  flex: none;
}
.pg__clue-chip--yes {
  color: #1a7d4a;
  background: #e4f7ec;
}
.pg__clue-chip--no {
  color: var(--mantine-color-accent-8);
  background: var(--mantine-color-accent-0);
}

@keyframes pg-clue-in {
  from {
    opacity: 0;
    transform: translateY(3px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pg-card-flip {
  0% {
    transform: perspective(700px) rotateY(0deg) scale(1);
  }
  45% {
    transform: perspective(700px) rotateY(90deg) scale(0.97);
  }
  55% {
    transform: perspective(700px) rotateY(-90deg) scale(0.97);
  }
  100% {
    transform: perspective(700px) rotateY(0deg) scale(1);
  }
}

/* A tiny settle-bounce right after the flip lands. */
@keyframes pg-card-bounce {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.045);
  }
  70% {
    transform: scale(0.985);
  }
  100% {
    transform: scale(1);
  }
}

/* Soft glow that blooms and fades back to the card's normal resting shadow — the 0%/100%
   values intentionally match .pg__card's static resting box-shadow so there's no visible
   snap when the animation ends and this class is removed. */
@keyframes pg-card-glow {
  0%,
  100% {
    box-shadow: 0 2px 4px color-mix(in srgb, var(--mantine-color-brandPurple-6) 6%, transparent), 0 16px 30px color-mix(in srgb, var(--mantine-color-brandPurple-6) 12%, transparent);
  }
  45% {
    box-shadow: 0 2px 4px color-mix(in srgb, var(--mantine-color-brandPurple-6) 6%, transparent), 0 16px 30px color-mix(in srgb, var(--mantine-color-brandPurple-6) 12%, transparent), 0 0 0 9px color-mix(in srgb, var(--mantine-color-accent-6) 16%, transparent);
  }
}

@keyframes pg-crown-sway {
  0%,
  100% {
    transform: rotate(0deg) scale(1);
  }
  50% {
    transform: rotate(-6deg) scale(1.08);
  }
}

@keyframes pg-score-pulse {
  0% {
    transform: scale(1);
  }
  35% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes pg-float-rise {
  0% {
    opacity: 0;
    transform: translateY(4px) scale(0.9);
  }
  15% {
    opacity: 1;
    transform: translateY(-2px) scale(1);
  }
  75% {
    opacity: 1;
    transform: translateY(-16px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-24px) scale(0.96);
  }
}

/* board density tiers — cards shrink as the count grows so the table never needs to scroll.
   Gap itself is handled by the single clamp() rule on .pg__board; these tiers only scale
   the card's own chrome (min-height, padding, avatar/font sizes). */
.pg__board--sparse .pg__card {
  min-height: 240px;
  padding: 26px 18px 20px;
}
.pg__board--sparse .pg__card-avatar {
  width: 66px;
  height: 66px;
  font-size: 21px;
}

.pg__board--dense .pg__card {
  min-height: 172px;
  padding: 16px 12px 12px;
  gap: 7px;
  border-radius: 18px;
}
.pg__board--dense .pg__card-avatar {
  width: 46px;
  height: 46px;
  font-size: 15px;
}
.pg__board--dense .pg__card-name {
  font-size: 13px;
}
.pg__board--dense .pg__card-value {
  width: 38px;
  height: 38px;
}
.pg__board--dense .pg__card-value-num {
  font-size: 13px;
}
.pg__board--dense .pg__clue-list {
  max-height: 76px;
}
.pg__board--dense .pg__card-number {
  top: 8px;
  inset-inline-start: 8px;
  min-width: 19px;
  height: 19px;
  font-size: 10px;
}

.pg__board--compact .pg__card {
  min-height: 136px;
  padding: 12px 8px 8px;
  gap: 5px;
  border-radius: 15px;
}
.pg__board--compact .pg__card-avatar {
  width: 36px;
  height: 36px;
  font-size: 12.5px;
  box-shadow: 0 0 0 2px #fff, 0 0 0 3px color-mix(in srgb, var(--mantine-color-brandPurple-6) 22%, transparent);
}
.pg__board--compact .pg__card-name {
  font-size: 11.5px;
}
.pg__board--compact .pg__card-value {
  width: 30px;
  height: 30px;
}
.pg__board--compact .pg__card-value-num {
  font-size: 11px;
}
.pg__board--compact .pg__card-value-unit {
  display: none;
}
.pg__board--compact .pg__clue-list {
  max-height: 48px;
  gap: 3px;
}
.pg__board--compact .pg__clue-chip {
  font-size: 9.5px;
  padding: 2px 6px 2px 5px;
}
.pg__board--compact .pg__card-number {
  top: 6px;
  inset-inline-start: 6px;
  min-width: 16px;
  height: 16px;
  padding: 0 3px;
  font-size: 9px;
}

.pg__board--tight .pg__card {
  min-height: 118px;
  padding: 10px 7px 7px;
  gap: 4px;
  border-radius: 13px;
}
.pg__board--tight .pg__card-avatar {
  width: 30px;
  height: 30px;
  font-size: 11px;
  box-shadow: 0 0 0 2px #fff, 0 0 0 3px color-mix(in srgb, var(--mantine-color-brandPurple-6) 20%, transparent);
}
.pg__board--tight .pg__card-name {
  font-size: 10px;
}
.pg__board--tight .pg__card-value {
  width: 26px;
  height: 26px;
}
.pg__board--tight .pg__card-value-num {
  font-size: 9.5px;
}
.pg__board--tight .pg__card-value-unit {
  display: none;
}
.pg__board--tight .pg__clue-list {
  max-height: 36px;
  gap: 2px;
}
.pg__board--tight .pg__clue-chip {
  font-size: 8.5px;
  padding: 1px 5px 1px 4px;
}
.pg__board--tight .pg__card-number {
  top: 5px;
  inset-inline-start: 5px;
  min-width: 14px;
  height: 14px;
  padding: 0 2px;
  font-size: 8px;
}

.pg__board--micro .pg__card {
  min-height: 100px;
  padding: 8px 6px 6px;
  gap: 3px;
  border-radius: 11px;
}
.pg__board--micro .pg__card-avatar {
  width: 24px;
  height: 24px;
  font-size: 9.5px;
  box-shadow: 0 0 0 2px #fff, 0 0 0 3px color-mix(in srgb, var(--mantine-color-brandPurple-6) 18%, transparent);
}
.pg__board--micro .pg__card-name {
  font-size: 9px;
}
.pg__board--micro .pg__card-value {
  width: 22px;
  height: 22px;
}
.pg__board--micro .pg__card-value-num {
  font-size: 8px;
}
.pg__board--micro .pg__card-value-unit {
  display: none;
}
.pg__board--micro .pg__clue-list {
  max-height: 26px;
  gap: 2px;
}
/* At 27-50 cards per-card clue chips stop being legible/useful at this size; the clue
   remains available via the guess flow, it's just not echoed on the card itself. */
.pg__board--micro .pg__clue-chip {
  display: none;
}
.pg__board--micro .pg__card-number {
  top: 4px;
  inset-inline-start: 4px;
  min-width: 13px;
  height: 13px;
  padding: 0 2px;
  font-size: 7px;
}

/* ---------- guess modal ---------- */
.pg__guess-guesser {
  margin: -4px 0 4px;
}

.pg__outcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 18px 4px 6px;
  animation: pg-fade-in 0.25s ease;
}

.pg__outcome-badge {
  width: 54px;
  height: 54px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.pg__outcome-badge--correct {
  color: #fff;
  background: linear-gradient(135deg, var(--mantine-color-accent-6), var(--mantine-color-brandPurple-6));
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--mantine-color-brandPurple-6) 14%, transparent);
  animation: pg-badge-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), pg-badge-glow 1.8s ease-in-out 0.4s 1;
}
.pg__outcome-badge--wrong {
  color: #fff;
  background: linear-gradient(135deg, var(--mantine-color-red-5), var(--mantine-color-red-7));
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--mantine-color-red-6) 14%, transparent);
  animation:
    pg-badge-pop 0.3s ease,
    pg-badge-shake 0.5s ease 0.3s,
    pg-badge-glow-wrong 1.4s ease-in-out 0.3s 1;
}

.pg__outcome-text {
  font-size: 17.5px;
  font-weight: 800;
  color: var(--mantine-color-brandPurple-9);
}
.pg__outcome--wrong .pg__outcome-text {
  color: var(--mantine-color-red-8);
}

@keyframes pg-badge-pop {
  from {
    transform: scale(0.5);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes pg-badge-glow {
  0%,
  100% {
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--mantine-color-brandPurple-6) 14%, transparent);
  }
  50% {
    box-shadow: 0 0 0 11px color-mix(in srgb, var(--mantine-color-accent-6) 16%, transparent);
  }
}

@keyframes pg-badge-glow-wrong {
  0%,
  100% {
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--mantine-color-red-6) 14%, transparent);
  }
  50% {
    box-shadow: 0 0 0 11px color-mix(in srgb, var(--mantine-color-red-6) 20%, transparent);
  }
}

/* A brisk side-to-side shake so the "wrong" cue isn't color-only. */
@keyframes pg-badge-shake {
  0%,
  100% {
    transform: translateX(0);
  }
  20% {
    transform: translateX(-4px);
  }
  40% {
    transform: translateX(4px);
  }
  60% {
    transform: translateX(-3px);
  }
  80% {
    transform: translateX(3px);
  }
}

@keyframes pg-fade-in {
  from {
    opacity: 0;
    transform: translateY(2px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .pg * {
    animation-duration: 0.001ms !important;
  }
}

/* ==== Verbatim from Client/src/pages/Results/ResultsPage.css ==== */
/*
 * Results page polish — additive only. The plain standings list is untouched; this file adds
 * the winner-row highlight (same gradient/glow language as the Personality game screen) and
 * the end-of-game celebration overlay that plays once when a winner exists, then fades away
 * on its own, leaving the ordinary results list in place.
 */

.results {
  position: relative;
}

/* ---------- winner row, in the persistent standings list ---------- */
.results-row--winner {
  border-color: var(--mantine-color-accent-3) !important;
  background: linear-gradient(160deg, #fff 0%, var(--mantine-color-accent-0) 100%);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--mantine-color-accent-6) 14%, transparent);
  animation: results-winner-in 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
}

@keyframes results-winner-in {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ---------- celebration overlay ---------- */
.results-confetti {
  position: fixed;
  inset: 0;
  z-index: 201;
  pointer-events: none;
}

.results-celebration {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: color-mix(in srgb, #fff 55%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: results-overlay-in 0.35s ease;
}
.results-celebration--leaving {
  animation: results-overlay-out 0.45s ease forwards;
  pointer-events: none;
}

@keyframes results-overlay-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes results-overlay-out {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

.results-celebration__card {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  max-width: min(90vw, 420px);
  padding: 36px 32px 32px;
  border-radius: 26px;
  background: linear-gradient(165deg, #fff 0%, var(--mantine-color-accent-0) 55%, var(--mantine-color-brandPurple-0) 140%);
  border: 1px solid color-mix(in srgb, #fff 90%, transparent);
  box-shadow: 0 30px 70px color-mix(in srgb, var(--mantine-color-brandPurple-6) 22%, transparent);
  animation: results-card-in 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) 0.1s both;
  text-align: center;
}

@keyframes results-card-in {
  from {
    opacity: 0;
    transform: scale(0.88) translateY(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.results-celebration__gif {
  max-width: 220px;
  max-height: 160px;
  object-fit: contain;
  border-radius: 16px;
  margin-bottom: 4px;
}

.results-celebration__trophy {
  color: var(--mantine-color-accent-6);
  filter: drop-shadow(0 4px 10px color-mix(in srgb, var(--mantine-color-accent-6) 35%, transparent));
  animation: results-trophy-bounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both;
}

@keyframes results-trophy-bounce {
  0% {
    transform: scale(0.4) translateY(10px);
    opacity: 0;
  }
  60% {
    transform: scale(1.12) translateY(-4px);
    opacity: 1;
  }
  100% {
    transform: scale(1) translateY(0);
  }
}

.results-celebration__eyebrow {
  margin: 8px 0 0;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--mantine-color-accent-8);
}

.results-celebration__name {
  margin: 2px 0 0;
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 800;
  letter-spacing: -0.01em;
  background: linear-gradient(100deg, var(--mantine-color-brandPurple-6) 0%, var(--mantine-color-accent-8) 55%, var(--mantine-color-accent-4) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.results-celebration__score {
  display: flex;
  align-items: baseline;
  gap: 5px;
  margin: 4px 0 0;
  font-size: 30px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--mantine-color-brandPurple-7);
}
.results-celebration__score span {
  font-size: 14px;
  font-weight: 700;
  color: var(--mantine-color-brandPurple-5);
}

.results-celebration__sub {
  margin: 2px 0 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--mantine-color-neutral-6);
}

@media (prefers-reduced-motion: reduce) {
  .results-celebration,
  .results-celebration *,
  .results-row--winner {
    animation-duration: 0.001ms !important;
  }
}


/* ==== Verbatim from Client/src/components/GameNotificationCard.css ==== */
/* ---------- in-game notification: floating, bottom-center, portaled to <body> ----------
   Never a browser alert / toast library / snackbar — a single small premium card in the
   platform's visual language, shared by every game's play screen. Never stacks: a new call
   replaces it outright (see useGameNotification), and it never waits for the player to dismiss it. */
.game-notif {
  position: fixed;
  bottom: 30px;
  left: 50%;
  z-index: 1000;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  max-width: min(90vw, 380px);
  padding: 11px 18px;
  border-radius: 18px;
  font-family: var(--mantine-font-family);
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.35;
  background: color-mix(in srgb, #fff 90%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 12px 30px rgba(47, 42, 54, 0.16), 0 2px 8px rgba(47, 42, 54, 0.07);
  pointer-events: none;
  transform: translate(-50%, 0) scale(1);
  animation: game-notif-in 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.game-notif--leaving {
  animation: game-notif-out 0.26s ease forwards;
}

.game-notif-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  flex: none;
}
.game-notif-text {
  overflow-wrap: anywhere;
}

.game-notif--info {
  border: 1px solid color-mix(in srgb, var(--mantine-color-brandPurple-6) 20%, transparent);
  color: var(--mantine-color-brandPurple-8);
}
.game-notif--info .game-notif-icon {
  background: var(--mantine-color-brandPurple-0);
  color: var(--mantine-color-brandPurple-6);
}

.game-notif--success {
  border: 1px solid color-mix(in srgb, var(--mantine-color-green-6) 22%, transparent);
  color: var(--mantine-color-green-8);
}
.game-notif--success .game-notif-icon {
  background: var(--mantine-color-green-0);
  color: var(--mantine-color-green-7);
}

.game-notif--warning {
  border: 1px solid color-mix(in srgb, var(--mantine-color-accent-6) 22%, transparent);
  color: var(--mantine-color-accent-8);
}
.game-notif--warning .game-notif-icon {
  background: var(--mantine-color-accent-0);
  color: var(--mantine-color-accent-7);
}

.game-notif--error {
  border: 1px solid color-mix(in srgb, var(--mantine-color-red-6) 24%, transparent);
  color: var(--mantine-color-red-8);
}
.game-notif--error .game-notif-icon {
  background: var(--mantine-color-red-0);
  color: var(--mantine-color-red-7);
}

@keyframes game-notif-in {
  from {
    opacity: 0;
    transform: translate(-50%, 8px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
}

@keyframes game-notif-out {
  from {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  to {
    opacity: 0;
    transform: translate(-50%, 6px) scale(0.96);
  }
}

@media (prefers-reduced-motion: reduce) {
  .game-notif,
  .game-notif--leaving {
    animation-duration: 0.001ms !important;
  }
  .gate-deco,
  .gate-star,
  .ui-home-star {
    animation-duration: 0.001ms !important;
  }
}

/*
 * Access gate — dark "hero" treatment ported from the main site's HomePage.css, so the very
 * first thing a recipient sees matches the site's brand instead of the light in-app theme below.
 */
.gate-screen {
  position: relative;
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 7vw;
  background: radial-gradient(120% 60% at 20% 0%, #2E1B40 0%, #180F24 55%), #180F24;
  color: #F7F3FC;
  direction: rtl;
}
.gate-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.gate-stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.gate-star {
  position: absolute;
  opacity: 0.75;
  filter: drop-shadow(0 0 5px currentColor);
  animation: gate-twinkle 3s ease-in-out infinite;
}
.gate-title-wrap {
  position: relative;
  margin: 0 0 8px;
  padding: 6px 0;
}
.gate-title {
  font-size: clamp(32px, 7vw, 44px);
  font-weight: 800;
  margin: 0;
  background: linear-gradient(95deg, var(--mantine-color-accent-6), var(--mantine-color-brandPurple-4));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.gate-deco {
  position: absolute;
  color: var(--mantine-color-accent-5);
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--mantine-color-accent-6) 70%, transparent));
  animation: gate-twinkle 2.6s ease-in-out infinite;
}
.gate-deco--1 { top: -6px; right: 6%; animation-delay: 0s; }
.gate-deco--2 { bottom: -2px; left: 10%; color: var(--mantine-color-brandPurple-4); animation-delay: 0.6s; }
.gate-deco--3 { top: 40%; right: -6px; font-size: 10px; animation-delay: 1.2s; }
.gate-deco--4 { bottom: 10%; left: -10px; font-size: 10px; color: var(--mantine-color-brandPurple-4); animation-delay: 1.8s; }
@keyframes gate-twinkle {
  0%, 100% { opacity: 0.35; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.05); }
}
.gate-sub {
  font-size: 15px;
  line-height: 1.6;
  color: #B7A9C9;
  margin: 0 0 26px;
}
.gate-field { margin-bottom: 14px; }
.gate-input {
  width: 100%;
  height: 46px;
  padding: 0 16px;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
  color: #F7F3FC;
  font: inherit;
  font-size: 18px;
  letter-spacing: 0.06em;
  text-align: center;
}
.gate-input::placeholder { color: #8A7C9E; letter-spacing: normal; }
.gate-input:focus {
  outline: none;
  border-color: var(--mantine-color-accent-6);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--mantine-color-accent-6) 30%, transparent);
}
.gate-error {
  color: var(--mantine-color-red-4);
  font-size: 13px;
  margin: -4px 0 14px;
}
.gate-submit {
  width: 100%;
  height: 46px;
  border: none;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(95deg, var(--mantine-color-accent-6), var(--mantine-color-brandPurple-6));
  box-shadow: 0 8px 28px color-mix(in srgb, var(--mantine-color-accent-6) 35%, transparent);
}
.gate-submit:hover { filter: brightness(1.06); }

.gate-codes-modal .ui-modal { max-width: 420px; }
.gate-codes-table { width: 100%; border-collapse: collapse; text-align: right; }
.gate-codes-table th, .gate-codes-table td {
  padding: 8px 6px;
  border-bottom: 1px solid var(--mantine-color-neutral-3);
  font-size: 14px;
}
.gate-codes-table code {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--mantine-color-brandPurple-7);
}


/* ===================================================================================
 * WOW THEME (2026-11-17) — visual-only override layer. Game-show / neon night look:
 * deep navy-violet stage, neon cyan-magenta frame glow, glossy 3D buttons, gold accents,
 * per-player team colors (red / yellow / green / blue). No layout or logic changes.
 * =================================================================================== */
:root {
  --wow-bg-1: #1a0d2b;
  --wow-bg-2: #2c1745;
  --wow-bg-3: #2a0f4a;
  --wow-cyan: #FF8A4D;
  --wow-magenta: #B190CE;
  --wow-gold: #FF8A4D;
  --wow-gold-2: #FF6A21;
  --wow-glass: rgba(24, 18, 66, 0.72);
  --wow-glass-border: rgba(201, 175, 220, 0.28);
  --wow-text: #f4f1ff;
  --wow-dim: #CDB9E0;
  --wow-p1: #FF6A21;
  --wow-p2: #C9AFDC;
  --wow-p3: #2fe07a;
  --wow-p4: #3d8bff;
  --wow-p5: #ffd23f;
  --wow-p6: #ff3b5c;
}

html {
  min-height: 100%;
  color: var(--wow-text);
  background:
    radial-gradient(60% 45% at 15% 0%, rgba(153, 115, 190, 0.22) 0%, transparent 70%),
    radial-gradient(55% 40% at 85% 5%, rgba(255, 138, 77, 0.18) 0%, transparent 70%),
    radial-gradient(70% 50% at 50% 110%, rgba(122, 79, 163, 0.35) 0%, transparent 70%),
    linear-gradient(180deg, var(--wow-bg-1) 0%, var(--wow-bg-2) 55%, var(--wow-bg-3) 100%);
  min-height: 100%;
}
/* faint twinkling starfield behind every screen */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 28% 72%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 44% 32%, #bfe9ff 50%, transparent 51%),
    radial-gradient(1px 1px at 63% 12%, #fff 50%, transparent 51%),
    radial-gradient(2px 2px at 78% 58%, #ffd6f3 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 26%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 86%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 52% 90%, #bfe9ff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 94% 84%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 36% 50%, #fff 50%, transparent 51%);
  opacity: 0.55;
  animation: wow-twinkle 4s ease-in-out infinite alternate;
}
body { background: transparent; color: var(--wow-text); }
body > * { position: relative; z-index: 1; }
@keyframes wow-twinkle { from { opacity: 0.35; } to { opacity: 0.75; } }

/* ---------- Topbar / text ---------- */
.ui-topbar-brand { color: var(--wow-gold); text-shadow: 0 0 12px rgba(255, 106, 33, 0.45); }
.ui-text-dimmed, .ui-field-desc, .ui-home-stat-label { color: var(--wow-dim); }
h1, h2, h3, h4, .ui-modal-title, .ui-field-label { color: var(--wow-text); }

/* ---------- Glass panels with neon frame ---------- */
.ui-paper, .ui-modal {
  background: linear-gradient(180deg, rgba(62, 40, 86, 0.78), rgba(36, 22, 54, 0.82));
  border: 1.5px solid var(--wow-glass-border);
  border-radius: 18px;
  box-shadow:
    0 0 0 1px rgba(255, 138, 77, 0.10) inset,
    0 0 24px rgba(255, 138, 77, 0.18),
    0 0 48px rgba(153, 115, 190, 0.10),
    0 18px 40px rgba(0, 0, 0, 0.45);
  color: var(--wow-text);
  backdrop-filter: blur(6px);
}
.ui-modal-overlay { background: rgba(18, 8, 28, 0.7); backdrop-filter: blur(4px); }

/* ---------- Glossy 3D buttons ---------- */
.ui-btn {
  position: relative;
  border-radius: 14px;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(180deg, #9973BE 0%, #7A4FA3 55%, #6B4491 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.35),
    inset 0 -3px 0 rgba(0, 0, 0, 0.25),
    0 4px 0 #3E2856,
    0 10px 22px rgba(122, 79, 163, 0.45);
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
  transition: transform 0.1s ease, filter 0.15s ease, box-shadow 0.1s ease;
}
.ui-btn:hover:not(:disabled) { background: linear-gradient(180deg, #B190CE 0%, #8a5fb5 55%, #7A4FA3 100%); filter: brightness(1.06); }
.ui-btn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.25), 0 1px 0 #3E2856, 0 4px 10px rgba(122,79,163,0.4);
}
/* primary CTA = gold game-show button */
.ui-btn--gradient, .ui-btn--gradient:hover:not(:disabled) {
  color: #fff;
  text-shadow: 0 1px 1px rgba(120, 40, 0, 0.5);
  background: linear-gradient(180deg, #FFC9A8 0%, #FF8A4D 45%, #FF6A21 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.7),
    inset 0 -3px 0 rgba(160, 90, 0, 0.35),
    0 4px 0 #9C3A0C,
    0 0 26px rgba(255, 106, 33, 0.55),
    0 12px 26px rgba(0, 0, 0, 0.4);
}
.ui-btn--light {
  color: var(--wow-text);
  background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
  border: 1.5px solid rgba(255, 138, 77, 0.45);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 0 14px rgba(255, 138, 77, 0.2);
}
.ui-btn--light:hover:not(:disabled) { background: linear-gradient(180deg, rgba(255,138,77,0.25), rgba(255,138,77,0.1)); }
.ui-btn--subtle { background: transparent; box-shadow: none; color: var(--wow-cyan); text-shadow: none; }
.ui-btn--subtle:hover:not(:disabled) { background: rgba(255, 138, 77, 0.12); }
.ui-btn--danger {
  background: linear-gradient(180deg, #ff6b81 0%, #ff3b5c 50%, #d81f43 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -3px 0 rgba(0,0,0,0.25), 0 4px 0 #8a0f28, 0 10px 22px rgba(255,59,92,0.4);
}
.ui-btn--danger:hover:not(:disabled) { background: linear-gradient(180deg, #ff7d90, #ff4b6a 50%, #e02a4e); }

.ui-help-btn {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255, 138, 77, 0.55);
  color: var(--wow-cyan);
  box-shadow: 0 0 10px rgba(255, 138, 77, 0.3);
}
.ui-help-btn:hover { background: rgba(255, 138, 77, 0.18); border-color: var(--wow-cyan); }

/* ---------- Form controls ---------- */
.ui-input, select.ui-input {
  background: rgba(20, 10, 32, 0.6);
  border: 1.5px solid rgba(177, 144, 206, 0.4);
  color: var(--wow-text);
  border-radius: 12px;
}
select.ui-input option { background: #2c1745; color: var(--wow-text); }
.ui-input:focus { border-color: var(--wow-cyan); box-shadow: 0 0 0 3px rgba(255, 138, 77, 0.22), 0 0 16px rgba(255, 138, 77, 0.3); }
.ui-input::placeholder { color: #8079b0; }
.ui-switch-track { background: rgba(255,255,255,0.15); }
.ui-switch--on .ui-switch-track { background: linear-gradient(90deg, var(--wow-cyan), #9973BE); box-shadow: 0 0 12px rgba(255,138,77,0.5); }
.ui-switch-label { color: var(--wow-text); }
.ui-segmented { border-color: rgba(177, 144, 206, 0.4); border-radius: 12px; background: rgba(20, 10, 32, 0.45); }
.ui-segmented button { color: var(--wow-dim); background: transparent; }
.ui-segmented button + button { border-inline-start-color: rgba(177, 144, 206, 0.3); }
.ui-segmented button.ui-segmented__opt--active {
  color: #fff;
  background: linear-gradient(180deg, #FFC9A8, #FF8A4D 50%, #FF6A21);
  box-shadow: 0 0 16px rgba(255, 106, 33, 0.5);
}
.ui-alert { background: rgba(255, 138, 77, 0.1); color: #FFE4D3; border: 1px solid rgba(255, 138, 77, 0.3); }
.ui-alert--danger { background: rgba(255, 59, 92, 0.12); color: #ffc2cd; border-color: rgba(255, 59, 92, 0.4); }
.ui-table th { color: var(--wow-dim); }
.ui-table td { border-color: rgba(255,255,255,0.08) !important; }
.ui-table tbody tr:hover { background: rgba(255,255,255,0.05); }
.ui-instructions h4 { color: var(--wow-gold); }
.ui-instructions h5 { color: var(--wow-cyan); }
.ui-instructions p, .ui-instructions ul { color: #ddd8f5; }
.ui-instructions hr { border-top-color: rgba(255,255,255,0.15); }

/* ---------- Home ---------- */
.ui-home-page { background: transparent; }
.ui-home-hero { padding-top: 64px; }
.ui-home-eyebrow {
  color: #fff;
  background: linear-gradient(90deg, var(--wow-cyan), #FFAA79 50%, var(--wow-gold));
  border: none;
  box-shadow: 0 0 18px rgba(255, 138, 77, 0.4);
}
.ui-home-hero h1, .mmx__header-name {
  font-size: clamp(40px, 7vw, 72px);
  font-weight: 900 !important;
  background: linear-gradient(180deg, #ffffff 0%, #FFC9A8 35%, #FF6A21 70%, #ff7a1a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 0 #6a2a00) drop-shadow(0 0 22px rgba(255, 106, 33, 0.55));
}
.mmx__header-name { font-size: clamp(20px, 2.6vw, 28px); filter: drop-shadow(0 2px 0 #6a2a00) drop-shadow(0 0 12px rgba(255,106,33,0.5)); }
.ui-home-star { opacity: 0.9; }
.ui-home-stat {
  background: rgba(20, 10, 32, 0.45);
  border: 1.5px solid rgba(255, 138, 77, 0.3);
  border-radius: 14px;
}
.ui-home-stat-value { color: #fff; font-size: 26px; text-shadow: 0 0 12px rgba(255, 138, 77, 0.6); }
.ui-home-stat--characters .ui-home-stat-icon { background: rgba(255, 138, 77, 0.18); color: var(--wow-cyan); box-shadow: 0 0 12px rgba(255,138,77,0.45); }
.ui-home-stat--questions .ui-home-stat-icon { background: rgba(153, 115, 190, 0.18); color: var(--wow-magenta); box-shadow: 0 0 12px rgba(153,115,190,0.45); }

/* ---------- Game stage ---------- */
/* play screen is rendered without a ui-shell wrapper, so the inherited negative margin pushed the
   header off the top and left a band at the bottom — fill the viewport exactly instead */
.mmx { background: transparent; margin-block: 0; height: 100vh; padding-top: 16px; }
.mmx__stage { padding: 22px; }
.mmx__eyebrow { color: var(--wow-cyan); }
.mmx__eyebrow svg { color: var(--wow-cyan); }
.mmx__round-pill {
  color: #fff;
  background: linear-gradient(180deg, #FFC9A8, #FF8A4D 50%, #FF6A21);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 3px 0 #9C3A0C, 0 0 20px rgba(255, 106, 33, 0.5);
}
.mmx__round-pill--paused { color: var(--wow-dim); background: rgba(255,255,255,0.1); box-shadow: none; }
.mmx__pause-btn { background: rgba(255,255,255,0.1); color: var(--wow-cyan); border: 1.5px solid rgba(255,138,77,0.45); }
.mmx__pause-btn:hover { background: rgba(255, 138, 77, 0.2); }
.mmx__meta-chip {
  color: var(--wow-text);
  background: rgba(20, 10, 32, 0.55);
  border: 1.5px solid rgba(255, 138, 77, 0.35);
  box-shadow: 0 0 12px rgba(255, 138, 77, 0.2);
  font-size: 14px;
}
/* turn tag text dark on light player colors */
/* players = team pods, each with its own color */
.mmx__players-row { gap: 14px; }
.mmx__player-chip {
  --pc: var(--wow-p1);
  background: linear-gradient(180deg, rgba(62, 40, 86, 0.85), rgba(30, 18, 46, 0.9));
  border: 2px solid color-mix(in srgb, var(--pc) 55%, transparent);
  padding: 8px 18px 8px 10px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  opacity: 0.8;
}
.mmx__player-chip:nth-child(6n+2) { --pc: var(--wow-p2); }
.mmx__player-chip:nth-child(6n+3) { --pc: var(--wow-p3); }
.mmx__player-chip:nth-child(6n+4) { --pc: var(--wow-p4); }
.mmx__player-chip:nth-child(6n+5) { --pc: var(--wow-p5); }
.mmx__player-chip:nth-child(6n+6) { --pc: var(--wow-p6); }
.mmx__player-chip--active {
  opacity: 1;
  border-color: var(--pc);
  background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 30%, #2c1745), rgba(30, 18, 46, 0.95));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 30%, transparent), 0 0 26px color-mix(in srgb, var(--pc) 60%, transparent), 0 8px 18px rgba(0,0,0,0.4);
  transform: translateY(-3px) scale(1.08);
  animation: wow-turn-pulse 1.6s ease-in-out infinite;
}
@keyframes wow-turn-pulse {
  0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 30%, transparent), 0 0 18px color-mix(in srgb, var(--pc) 45%, transparent), 0 8px 18px rgba(0,0,0,0.4); }
  50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 45%, transparent), 0 0 34px color-mix(in srgb, var(--pc) 75%, transparent), 0 8px 18px rgba(0,0,0,0.4); }
}
.mmx__player-avatar {
  width: 32px; height: 32px; font-size: 14px;
  color: #1a0b00;
  background: radial-gradient(circle at 35% 30%, #fff 0%, color-mix(in srgb, var(--pc) 70%, #fff) 25%, var(--pc) 60%, color-mix(in srgb, var(--pc) 60%, #000) 100%);
  box-shadow: 0 0 10px color-mix(in srgb, var(--pc) 70%, transparent);
}
.mmx__player-name { color: #fff; font-size: 15px; }
.mmx__player-score {
  color: var(--pc);
  font-size: 17px;
  font-weight: 900;
  text-shadow: 0 0 10px color-mix(in srgb, var(--pc) 70%, transparent);
}
.mmx__player-turn-tag {
  color: #1a0b00;
  background: var(--pc);
  border-radius: 999px;
  padding: 1px 8px;
  font-size: 11px;
}

/* board sits inside a neon-framed "screen" */
.mmx__board {
  padding: clamp(10px, 1.8vw, 22px);
  border-radius: 24px;
  background: radial-gradient(80% 80% at 50% 40%, rgba(107, 68, 145, 0.35), rgba(26, 13, 43, 0.55));
  border: 2px solid rgba(255, 138, 77, 0.55);
  box-shadow:
    0 0 0 1px rgba(153, 115, 190, 0.35) inset,
    0 0 30px rgba(255, 138, 77, 0.35),
    0 0 60px rgba(153, 115, 190, 0.18),
    inset 0 0 40px rgba(255, 138, 77, 0.12);
}

/* card back: deep jewel tile, gold rim, diamond pattern, glowing "?" medallion */
.mmx__card { transition: transform 0.15s ease; }
.mmx__card:not(:disabled):hover { transform: translateY(-4px); }
.mmx__card-face { border-radius: 14px; }
.mmx__card-face--back {
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 106, 33, 0.25) 0%, transparent 38%),
    repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 8px, transparent 8px 16px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,0.05) 0 8px, transparent 8px 16px),
    linear-gradient(160deg, #9973BE 0%, #6B4491 45%, #3E2856 100%);
  border: 3px solid #FF8A4D;
  box-shadow:
    inset 0 0 0 2px rgba(120, 60, 0, 0.5),
    inset 0 2px 0 rgba(255,255,255,0.35),
    0 0 14px rgba(255, 106, 33, 0.35),
    0 10px 20px -6px rgba(0, 0, 0, 0.6);
}
.mmx__card-face--back::after {
  content: '?';
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 46%;
  height: auto;
  aspect-ratio: 1 / 1;
  align-self: center;
  min-height: 0;
  line-height: 1;
  overflow: hidden;
  border-radius: 50%;
  font-size: clamp(16px, 3.4vw, 40px);
  font-weight: 900;
  color: #fff;
  background: radial-gradient(circle at 35% 30%, #FFE4D3 0%, #FF8A4D 45%, #C64A10 100%);
  box-shadow: inset 0 -3px 0 rgba(120, 60, 0, 0.4), 0 0 18px rgba(255, 106, 33, 0.75);
  text-shadow: 0 1px 1px rgba(120,40,0,0.5);
}
/* face-up: bright ivory "prize" card with gold frame */
.mmx__card-face--front {
  background: radial-gradient(circle at 50% 35%, #ffffff 0%, #FFF3EC 60%, #FFE4D3 100%);
  border: 3px solid #FF8A4D;
  box-shadow: 0 0 22px rgba(255, 106, 33, 0.55), 0 10px 20px -6px rgba(0,0,0,0.6);
}
.mmx__card-word {
  color: #3E2856;
  font-weight: 900;
  font-size: clamp(14px, 3vw, 26px);
  display: block;
  width: 100%;
  line-height: 1.15;
  /* never split a word mid-way — JS shrinks the font until the whole word fits */
  word-break: keep-all;
  overflow-wrap: normal;
  hyphens: none;
  white-space: normal;
}
/* matched: neon green win glow + pop */
.mmx__card--matched .mmx__card-face--front {
  border-color: #2fe07a;
  background: radial-gradient(circle at 50% 35%, #f3fff7 0%, #c9ffe0 70%, #8ff5bb 100%);
  box-shadow: 0 0 0 2px rgba(47, 224, 122, 0.4), 0 0 28px rgba(47, 224, 122, 0.8);
  animation: wow-match-pop 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) both;
}
.mmx__card--matched .mmx__card-word { color: #0b5a2c; }
@keyframes wow-match-pop {
  0% { transform: rotateY(180deg) scale(1); }
  45% { transform: rotateY(180deg) scale(1.07); }
  100% { transform: rotateY(180deg) scale(1); }
}

/* ---------- Results ---------- */
.results-row--winner {
  background: linear-gradient(90deg, rgba(255, 106, 33, 0.25), rgba(255, 106, 33, 0.08)) !important;
  border-color: var(--wow-gold) !important;
  box-shadow: 0 0 20px rgba(255, 106, 33, 0.45) !important;
}
.results-celebration__card {
  background: linear-gradient(180deg, #3E2856, #1e1030) !important;
  border: 2px solid var(--wow-gold) !important;
  box-shadow: 0 0 40px rgba(255, 106, 33, 0.5), 0 0 80px rgba(153, 115, 190, 0.3), 0 24px 60px rgba(0,0,0,0.6) !important;
  color: var(--wow-text);
}
.results-celebration__eyebrow { color: var(--wow-cyan) !important; }
.results-celebration__name {
  background: linear-gradient(180deg, #fff, #FFC9A8 40%, #FF6A21) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: transparent !important;
  filter: drop-shadow(0 0 14px rgba(255, 106, 33, 0.6));
}
.results-celebration__score, .results-celebration__score span { color: #fff !important; }
.results-celebration__sub { color: var(--wow-dim) !important; }

/* ---------- Toasts ---------- */
.game-notif {
  background: linear-gradient(180deg, rgba(62, 40, 86, 0.95), rgba(30, 18, 46, 0.95)) !important;
  color: #fff !important;
  border: 1.5px solid rgba(255, 138, 77, 0.5);
  box-shadow: 0 0 22px rgba(255, 138, 77, 0.35), 0 12px 30px rgba(0,0,0,0.5) !important;
  font-size: 15px;
}
.game-notif--success { border-color: #2fe07a; box-shadow: 0 0 24px rgba(47, 224, 122, 0.55), 0 12px 30px rgba(0,0,0,0.5) !important; }
.game-notif--warning {
  border-color: #FF6A21 !important;
  box-shadow: 0 0 24px rgba(255, 106, 33, 0.6), 0 12px 30px rgba(0,0,0,0.5) !important;
  animation: game-notif-in 0.28s cubic-bezier(0.2, 0.8, 0.3, 1), wow-oops-shake 0.45s ease 0.15s;
}
.game-notif--warning .game-notif-icon { background: #FF6A21 !important; color: #fff !important; }
@keyframes wow-oops-shake {
  0%, 100% { transform: translate(-50%, 0); }
  20% { transform: translate(calc(-50% - 7px), 0) rotate(-2deg); }
  40% { transform: translate(calc(-50% + 7px), 0) rotate(2deg); }
  60% { transform: translate(calc(-50% - 4px), 0); }
  80% { transform: translate(calc(-50% + 4px), 0); }
}
.game-notif--error { border-color: var(--wow-p1); }
.game-notif-text { color: #fff !important; }

.results-celebration { background: rgba(18, 8, 28, 0.72) !important; }
.results-celebration__trophy, .results > svg, .results .ui-text-center svg { color: var(--wow-gold) !important; filter: drop-shadow(0 0 16px rgba(255, 106, 33, 0.8)) !important; }
.ui-badge--accent { background: linear-gradient(180deg, #FFC9A8, #FF6A21); color: #fff; box-shadow: 0 0 10px rgba(255, 106, 33, 0.6); }
.results > span:first-of-type { color: var(--wow-gold) !important; filter: drop-shadow(0 0 16px rgba(255, 106, 33, 0.8)); }
.results h2 { font-size: 30px; color: #fff; text-shadow: 0 0 18px rgba(255, 138, 77, 0.5); }

/* ===================================================================================
 * PERSONALITY — "Mystery Theater" layer (2026-11-17). Loaded on top of wow-theme.css.
 * Same brand purple+orange game-show language as memory-match, with its own twist:
 * velvet curtains, spotlights from above, a stage framed by chasing marquee bulbs,
 * cards as velvet "mystery doors" with a glowing orange "?", ivory portrait when opened.
 * Visual only — no layout/logic changes.
 * =================================================================================== */

/* play screen has no ui-shell wrapper — undo the inherited negative margin (header was clipped) */
.pg {
  margin-block: 0;
  min-height: 100vh;
  padding-top: 16px;
  background: transparent;
  overflow: hidden;
}
/* velvet curtains on both sides */
.pg::before {
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.28) 0 6px, rgba(255,255,255,0.03) 6px 14px, rgba(0,0,0,0.18) 14px 22px) left top / 70px 100% no-repeat,
    repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 8px, rgba(255,255,255,0.03) 8px 16px, rgba(0,0,0,0.28) 16px 22px) right top / 70px 100% no-repeat,
    linear-gradient(90deg, #4a1f63 0, #6B4491 40px, rgba(107,68,145,0) 90px) left top / 90px 100% no-repeat,
    linear-gradient(270deg, #4a1f63 0, #6B4491 40px, rgba(107,68,145,0) 90px) right top / 90px 100% no-repeat;
  opacity: 0.85;
}
/* spotlights from above */
.pg::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    conic-gradient(from 160deg at 22% -6%, transparent 0deg, rgba(255, 201, 168, 0.13) 14deg, transparent 30deg),
    conic-gradient(from 170deg at 78% -6%, transparent 0deg, rgba(255, 138, 77, 0.13) 14deg, transparent 30deg),
    radial-gradient(60% 30% at 50% 102%, rgba(255, 106, 33, 0.22), transparent 70%);
  animation: pg-spot-sway 7s ease-in-out infinite alternate;
}
@keyframes pg-spot-sway { from { opacity: 0.75; } to { opacity: 1; } }

.pg__eyebrow { color: #FFAA79; }
.pg__eyebrow svg { color: #FF8A4D; }
.pg__header-name {
  font-weight: 900 !important;
  background: linear-gradient(180deg, #ffffff 0%, #FFC9A8 35%, #FF8A4D 70%, #FF6A21 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 0 #6a2a00) drop-shadow(0 0 12px rgba(255, 106, 33, 0.5));
}
.pg__round-pill {
  color: #fff;
  background: linear-gradient(180deg, #FFC9A8, #FF8A4D 45%, #FF6A21);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 3px 0 #9C3A0C, 0 0 20px rgba(255, 106, 33, 0.5);
  text-shadow: 0 1px 1px rgba(120, 40, 0, 0.5);
}
.pg__round-pill--paused { color: #CDB9E0; background: rgba(255,255,255,0.1); box-shadow: none; }
.pg__pause-btn, .pg__header-actions .ui-icon-btn {
  background: rgba(255,255,255,0.08) !important;
  color: #FF8A4D !important;
  border: 1.5px solid rgba(255, 138, 77, 0.5) !important;
  box-shadow: 0 0 10px rgba(255, 138, 77, 0.25) !important;
}

/* ---------- toolbar: dark velvet control bar ---------- */
.pg__toolbar {
  background: linear-gradient(180deg, rgba(62, 40, 86, 0.85), rgba(30, 18, 46, 0.9));
  border: 1.5px solid rgba(201, 175, 220, 0.25);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 24px rgba(0,0,0,0.35);
}
.pg__toolbar-divider { background: rgba(255, 138, 77, 0.35); }
.pg__toolbar-hint, .pg__question-empty { color: #FFC9A8; }
.pg__toolbar-label { color: #FF8A4D; font-size: 13px; }
.pg__turn-legend { color: #CDB9E0; }
.pg__turn-legend-swatch { background: rgba(255,255,255,0.15); box-shadow: 0 0 0 2px #FF6A21, 0 0 8px rgba(255,106,33,0.6); }

/* players: glowing spotlight avatars, one color per player */
.pg__player-col { --pc: #FF6A21; }
.pg__player-col:nth-child(6n+2) { --pc: #C9AFDC; }
.pg__player-col:nth-child(6n+3) { --pc: #2fe07a; }
.pg__player-col:nth-child(6n+4) { --pc: #3d8bff; }
.pg__player-col:nth-child(6n+5) { --pc: #ffd23f; }
.pg__player-col:nth-child(6n+6) { --pc: #ff3b5c; }
.pg__player-col:hover { background: rgba(255,255,255,0.07); }
.pg__player-chip-avatar {
  width: 32px; height: 32px; font-size: 13px;
  color: #1a0b00;
  background: radial-gradient(circle at 35% 30%, #fff 0%, color-mix(in srgb, var(--pc) 70%, #fff) 25%, var(--pc) 60%, color-mix(in srgb, var(--pc) 60%, #000) 100%);
  box-shadow: 0 0 10px color-mix(in srgb, var(--pc) 60%, transparent);

<script>
(function () {
  var LIMIT_MS = 240000;
  var cover = document.getElementById('dgpdemo-cover');
  var title = document.getElementById('dgpdemo-title');
  var text = document.getElementById('dgpdemo-text');
  var close = document.getElementById('dgpdemo-close');
  var timeUp = false;
  // Time is up: the demo ends, there is no way back.
  setTimeout(function () {
    timeUp = true;
    title.textContent = 'נהניתם? 😊';
    text.textContent = 'זו הייתה טעימה מהמשחק. את המשחק המלא, עם התוכן של המשפחה שלכם, מקבלים למייל מיד אחרי הרכישה.';
    close.hidden = true;
    cover.classList.add('is-on');
  }, LIMIT_MS);
  // Print: a note the visitor can close to keep playing.
  window.print = function () {
    if (timeUp) return;
    title.textContent = 'אין הדפסה בדמו';
    text.textContent = 'בגרסת ההדגמה אי אפשר להדפיס. את המשחק המלא להדפסה מקבלים למייל.';
    close.hidden = false;
    cover.classList.add('is-on');
  };
  close.addEventListener('click', function () { cover.classList.remove('is-on'); });
})();

// Helpers for the per-game seed script (seeds/<game>.js) that fills sample content and skips setup.
window.dgpDemo = (function () {
  var preparing = document.getElementById('dgpdemo-preparing');
  function visible(el) { return !!el && !el.disabled && !!(el.offsetParent || el.getClientRects().length); }
  return {
    // Runs each step until it returns true (retrying for up to 10s), then the next one.
    // The "preparing" cover stays on until the last step is done.
    steps: function (list) {
      var i = 0, since = Date.now();
      function next() {
        if (i >= list.length) { preparing.remove(); return; }
        var ok = false;
        try { ok = list[i](); } catch (e) { ok = false; }
        if (ok) { i++; since = Date.now(); setTimeout(next, 30); }
        else if (Date.now() - since < 10000) setTimeout(next, 120);
        else preparing.remove();
      }
      document.addEventListener('DOMContentLoaded', function () { setTimeout(next, 300); });
    },
    click: function (sel) {
      return function () { var el = document.querySelector(sel); if (!visible(el)) return false; el.click(); return true; };
    },
    type: function (sel, value) {
      return function () {
        var el = typeof sel === 'string' ? document.querySelector(sel) : sel();
        if (!visible(el)) return false;
        el.value = value;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
        return true;
      };
    },
    wait: function (ms) {
      var start = 0;
      return function () { if (!start) start = Date.now(); return Date.now() - start >= ms; };
    },
    run: function (fn) { return function () { fn(); return true; }; },
  };
})();
</script>

  var PEOPLE = [['סבא משה', [1, 1, 1, 1, 0]], ['סבתא רחל', [0, 1, 1, 1, 0]],
                ['דוד יוסי', [1, 0, 0, 0, 0]], ['מיכל הקטנה', [0, 0, 0, 0, 1]]];
  var content = {
    questions: Q.map(function (t, i) { return { id: 'q' + i, title: t, status: 'Active', displayOrder: i }; }),
    characters: PEOPLE.map(function (p, i) {
      var answers = {};
      p[1].forEach(function (a, qi) { answers['q' + qi] = !!a; });
      return { id: 'c' + i, title: p[0], status: 'Active', displayOrder: i, imageId: null, answers: answers };
    }),
    settings: { scoreEnabled: true, partialMatchingEnabled: true, ignoreWords: [] },
  };
  // Runs before the game's own start-up (registered earlier), so the game loads this content.
  document.addEventListener('DOMContentLoaded', function () {
    content.settings.ignoreWords = Personality.DEFAULT_IGNORE_WORDS.slice();
    Store.getContent = function () { return Promise.resolve(content); };
    Store.saveContent = function () { return Promise.resolve(); };
  });
  dgpDemo.steps([
    dgpDemo.click('[data-action=go-setup]'),
    dgpDemo.run(function () { App.state.ui.playerNames = ['אבא', 'אמא', 'נועה']; }),
    dgpDemo.click('[data-action=start-game]'),
  ]);
})();
