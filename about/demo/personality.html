<script>
'use strict';
/**
 * Standalone port of DynamicGamePlatform's Personality game engine.
 * Faithful translation of:
 *   - Domain/Engine/GameLogic/Personality/PersonalityGameLogic.cs
 *   - Domain/Engine/GameEngine.cs (ProcessActionAsync orchestration)
 *   - Client/src/pages/Game/Personality/personalityNameMatch.ts
 *   - Client/src/pages/Game/Personality/personalityLayout.ts
 *
 * Pure logic, no DOM/browser dependency — runnable under Node for testing and
 * loaded as-is in the browser (UMD-style export at the bottom).
 */

var Personality = (function () {
  'use strict';

  var INITIAL_CHARACTER_VALUE = 50;
  var WRONG_GUESS_PENALTY = 10;
  var MAX_CHARACTERS = 50;

  function getCrypto() {
    if (typeof crypto !== 'undefined' && crypto) return crypto;
    if (typeof globalThis !== 'undefined' && globalThis.crypto) return globalThis.crypto;
    return require('crypto').webcrypto;
  }

  /** UUID v4 via getRandomValues — unlike crypto.randomUUID(), not gated to secure contexts. */
  function uuid() {
    var bytes = new Uint8Array(16);
    getCrypto().getRandomValues(bytes);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    var hex = [];
    for (var i = 0; i < 16; i++) hex.push(bytes[i].toString(16).padStart(2, '0'));
    return (
      hex.slice(0, 4).join('') + '-' + hex.slice(4, 6).join('') + '-' + hex.slice(6, 8).join('') + '-' +
      hex.slice(8, 10).join('') + '-' + hex.slice(10, 16).join('')
    );
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  // ---------------------------------------------------------------------
  // Content helpers (mirror PersonalityContentManager.tsx / PersonalityCharacterData.cs)
  // ---------------------------------------------------------------------

  function activeQuestions(content) {
    return content.questions
      .filter(function (q) { return q.status === 'Active'; })
      .sort(function (a, b) { return a.displayOrder - b.displayOrder; });
  }

  /** All characters (any status) whose answers cover every active question — content-manager readiness. */
  function readyCharacters(content) {
    var activeQ = activeQuestions(content);
    return content.characters.filter(function (c) {
      return activeQ.every(function (q) { return Object.prototype.hasOwnProperty.call(c.answers, q.id); });
    });
  }

  function canPublish(content) {
    return activeQuestions(content).length > 0 && readyCharacters(content).length > 0;
  }

  /** Active + fully-answered characters eligible to appear on the board (PersonalityGameLogic.InitializeSession). */
  function eligibleCharacters(content) {
    var activeQIds = activeQuestions(content).map(function (q) { return q.id; });
    return content.characters.filter(function (c) {
      return c.status === 'Active' && activeQIds.every(function (id) { return Object.prototype.hasOwnProperty.call(c.answers, id); });
    });
  }

  // ---------------------------------------------------------------------
  // Session lifecycle (mirrors GameEngine.StartSessionAsync + InitializeSession)
  // ---------------------------------------------------------------------

  function startSession(content, playerNames) {
    var players = playerNames.map(function (name, i) {
      return { id: uuid(), displayName: name, joinOrder: i, currentScore: 0, status: 'Active', isWinner: false };
    });

    var questionIds = activeQuestions(content).map(function (q) { return q.id; });
    var eligible = shuffle(eligibleCharacters(content).slice(0, MAX_CHARACTERS));

    var windows = eligible.map(function (c, index) {
      return { index: index, characterContentId: c.id, isOpen: false, currentValue: INITIAL_CHARACTER_VALUE, reveals: {} };
    });

    return {
      players: players,
      status: 'Playing',
      state: { currentPhase: 'Playing', currentRound: 0, currentTurn: 0 },
      gameState: {
        windows: windows,
        remainingQuestionIds: questionIds.slice(),
        usedQuestionIds: [],
        scoreEnabled: !!content.settings.scoreEnabled,
        isPaused: false,
      },
    };
  }

  function activePlayersInOrder(session) {
    return session.players
      .filter(function (p) { return p.status === 'Active'; })
      .slice()
      .sort(function (a, b) { return a.joinOrder - b.joinOrder; });
  }

  function currentSelector(session) {
    var active = activePlayersInOrder(session);
    if (active.length === 0) return null;
    return active[session.state.currentTurn % active.length];
  }

  // ---------------------------------------------------------------------
  // Action validation (mirrors PersonalityGameLogic.ValidateAction)
  // ---------------------------------------------------------------------

  function validateAction(session, action) {
    var gs = session.gameState;

    if (gs.windows.length === 0) {
      return { valid: false, error: 'אין דמויות זמינות למשחק. יש להוסיף דמויות עם תשובה לכל שאלה פעילה.' };
    }
    if (gs.isPaused && action.type !== 'ResumeGame') {
      return { valid: false, error: 'המשחק מושהה.' };
    }

    switch (action.type) {
      case 'PauseGame':
        return gs.isPaused ? { valid: false, error: 'המשחק כבר מושהה.' } : { valid: true };

      case 'ResumeGame':
        return gs.isPaused ? { valid: true } : { valid: false, error: 'המשחק אינו מושהה.' };

      case 'SelectQuestion': {
        var questionId = action.payload && action.payload.questionContentId;
        if (!questionId) {
          return { valid: false, error: 'נדרש questionContentId.' };
        }
        if (gs.remainingQuestionIds.indexOf(questionId) === -1) {
          return { valid: false, error: 'שאלה זו אינה זמינה (כבר נשאלה או אינה פעילה).' };
        }
        var active = activePlayersInOrder(session);
        if (active.length === 0) {
          return { valid: false, error: 'אין שחקנים פעילים.' };
        }
        var selector = active[session.state.currentTurn % active.length];
        if (action.playerId !== selector.id) {
          return { valid: false, error: 'אין זה תורו של שחקן זה לבחור שאלה.' };
        }
        return { valid: true };
      }

      case 'DeclareGuess': {
        var guesserIds = (action.payload && action.payload.playerIds) || [];
        var allValid = guesserIds.length > 0 && guesserIds.every(function (id) {
          return session.players.some(function (p) { return p.id === id; });
        });
        if (!allValid) {
          return { valid: false, error: 'יש לבחור לפחות שחקן אחד תקין לניחוש.' };
        }
        if (gs.usedQuestionIds.length === 0) {
          return { valid: false, error: 'עדיין לא נחשפה אף שאלה.' };
        }
        var windowIndex = action.payload && action.payload.windowIndex;
        var characterContentId = action.payload && action.payload.characterContentId;
        if (windowIndex === undefined || windowIndex === null || !characterContentId) {
          return { valid: false, error: 'windowIndex ו-characterContentId נדרשים.' };
        }
        var win = gs.windows.filter(function (w) { return w.index === windowIndex; })[0];
        if (!win) {
          return { valid: false, error: 'החלון לא נמצא.' };
        }
        if (win.isOpen) {
          return { valid: false, error: 'החלון הזה כבר נפתח.' };
        }
        return { valid: true };
      }

      default:
        return { valid: false, error: "סוג פעולה לא ידוע: '" + action.type + "'." };
    }
  }

  // ---------------------------------------------------------------------
  // Action execution (mirrors PersonalityGameLogic.Execute*)
  // ---------------------------------------------------------------------

  function executeAction(session, content, action) {
    var gs = session.gameState;

    switch (action.type) {
      case 'PauseGame':
        gs.isPaused = true;
        session.state.currentPhase = 'Paused';
        return { messages: [], pendingScores: [] };

      case 'ResumeGame':
        gs.isPaused = false;
        session.state.currentPhase = 'Playing';
        return { messages: [], pendingScores: [] };

      case 'SelectQuestion': {
        var questionId = action.payload.questionContentId;
        var charactersById = {};
        content.characters.forEach(function (c) { charactersById[c.id] = c; });

        gs.windows.forEach(function (win) {
          if (win.isOpen) return;
          var character = charactersById[win.characterContentId];
          if (character && Object.prototype.hasOwnProperty.call(character.answers, questionId)) {
            win.reveals[questionId] = character.answers[questionId];
          }
          win.currentValue = Math.max(0, win.currentValue - 1);

        gs.remainingQuestionIds = gs.remainingQuestionIds.filter(function (id) { return id !== questionId; });
        gs.usedQuestionIds = gs.usedQuestionIds.concat([questionId]);

        var active = activePlayersInOrder(session);
        session.state.currentTurn = active.length === 0 ? 0 : (session.state.currentTurn + 1) % active.length;
        session.state.currentRound += 1;
        session.state.currentPhase = 'Playing';
        return { messages: [], pendingScores: [] };
      }

      case 'DeclareGuess': {
        var windowIndex = action.payload.windowIndex;
        var guessedCharacterId = action.payload.characterContentId;
        var guesserIds = action.payload.playerIds || [];

        var win = gs.windows.filter(function (w) { return w.index === windowIndex; })[0];
        var isCorrect = win.characterContentId === guessedCharacterId;
        var awardedValue = win.currentValue;

        // Only a correct guess opens the window — a wrong guess leaves the character hidden
        // and still guessable later in the round, by anyone.
        if (isCorrect) win.isOpen = true;

        var delta = isCorrect ? awardedValue : -WRONG_GUESS_PENALTY;
        var pendingScores = guesserIds.map(function (id) { return { playerId: id, delta: delta }; });

        session.state.currentPhase = 'Playing';
        return { messages: [isCorrect ? 'Correct guess.' : 'Wrong guess.'], pendingScores: pendingScores };
      }

      default:
        throw new Error("Unknown action type '" + action.type + "'.");

  function calculateScore(session, pendingScores) {
    if (!session.gameState.scoreEnabled || pendingScores.length === 0) return;
    pendingScores.forEach(function (entry) {
      var player = session.players.filter(function (p) { return p.id === entry.playerId; })[0];
      if (player) player.currentScore += entry.delta;

  function checkEndCondition(session) {
    var gs = session.gameState;
    return gs.windows.length > 0 && gs.windows.every(function (w) { return w.isOpen; });
  }

  function determineWinner(session) {
    if (!session.gameState.scoreEnabled) return;
    var active = session.players.filter(function (p) { return p.status === 'Active'; });
    if (active.length === 0) return;
    var maxScore = Math.max.apply(null, active.map(function (p) { return p.currentScore; }));
    active.forEach(function (p) {

  /** Mirrors GameEngine.ProcessActionAsync's orchestration order exactly. */
  function processAction(session, content, action) {
    if (session.status === 'Finished') {
      return { success: false, error: 'המשחק כבר הסתיים.', messages: [] };
    }

    var validation = validateAction(session, action);
    if (!validation.valid) {
      return { success: false, error: validation.error, messages: [] };
    }

    var result = executeAction(session, content, action);
    calculateScore(session, result.pendingScores);

    if (checkEndCondition(session)) {
      determineWinner(session);
      session.status = 'Finished';
    }

    return { success: true, messages: result.messages };
  }

  // ---------------------------------------------------------------------
  // Name matching (verbatim port of personalityNameMatch.ts)
  // ---------------------------------------------------------------------

  var PUNCTUATION_REGEX = /['"׳״.,!?;:()[\]{}\-–—]/g;

  function normalizeName(value) {
    return value
      .trim()
      .replace(PUNCTUATION_REGEX, '')
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  function generateAliases(name, ignoreWords, partialMatchingEnabled) {
    var normalizedIgnoreWords = {};
    ignoreWords.forEach(function (w) { normalizedIgnoreWords[normalizeName(w)] = true; });

    var aliases = {};
    var words = normalizeName(name).split(' ').filter(Boolean);
    if (words.length === 0) return [];

    aliases[words.join(' ')] = true;

    var stripped = words;
    if (words.length > 1 && normalizedIgnoreWords[words[0]]) {
      stripped = words.slice(1);
      aliases[stripped.join(' ')] = true;
    }

    if (partialMatchingEnabled && stripped.length > 1) {
      stripped.forEach(function (w) { aliases[w] = true; });
    }

    return Object.keys(aliases);
  }

  function buildAliasIndex(characters, ignoreWords, partialMatchingEnabled) {
    var index = {};
    characters.forEach(function (character) {
      generateAliases(character.title, ignoreWords, partialMatchingEnabled).forEach(function (alias) {
        if (!index[alias]) index[alias] = [];
        index[alias].push(character.id);
      });
    });
    return index;
  }

  function resolveCharacterId(typedText, aliasIndex) {
    var typed = normalizeName(typedText);
    if (!typed) return null;
    var candidates = aliasIndex[typed];
    return candidates && candidates.length === 1 ? candidates[0] : null;
  }

  // ---------------------------------------------------------------------
  // Board/player density layout (verbatim port of personalityLayout.ts)
  // ---------------------------------------------------------------------

  function computeBoardDensity(count) {
    if (count <= 4) return 'sparse';
    if (count <= 8) return 'cozy';
    if (count <= 12) return 'dense';
    if (count <= 18) return 'compact';
    if (count <= 26) return 'tight';
    return 'micro';
  }

  function computeBoardColumns(count) {
    if (count <= 4) return Math.max(1, count);
    return Math.min(10, Math.ceil(Math.sqrt(count * 1.8)));
  }

  function computePlayerDensity(count) {
    if (count <= 4) return 'sparse';
    if (count <= 6) return 'cozy';
    if (count <= 9) return 'dense';
    return 'compact';
  }

  var DEFAULT_IGNORE_WORDS = ['אמא', 'אבא', 'סבא', 'סבתא', 'דוד', 'דודה', 'הרב', 'הרבנית', 'מר', "גב'"];

  return {
    INITIAL_CHARACTER_VALUE: INITIAL_CHARACTER_VALUE,
    WRONG_GUESS_PENALTY: WRONG_GUESS_PENALTY,
    MAX_CHARACTERS: MAX_CHARACTERS,
    DEFAULT_IGNORE_WORDS: DEFAULT_IGNORE_WORDS,
    uuid: uuid,
    shuffle: shuffle,
    activeQuestions: activeQuestions,
    readyCharacters: readyCharacters,
    canPublish: canPublish,
    eligibleCharacters: eligibleCharacters,
    startSession: startSession,
    activePlayersInOrder: activePlayersInOrder,
    currentSelector: currentSelector,
    validateAction: validateAction,
    executeAction: executeAction,
    calculateScore: calculateScore,
    checkEndCondition: checkEndCondition,
    determineWinner: determineWinner,
    processAction: processAction,
    normalizeName: normalizeName,
    generateAliases: generateAliases,
    buildAliasIndex: buildAliasIndex,
    resolveCharacterId: resolveCharacterId,
    computeBoardDensity: computeBoardDensity,
    computeBoardColumns: computeBoardColumns,
    computePlayerDensity: computePlayerDensity,

/**
 * Local-only persistence: IndexedDB store for the game's content (characters/questions/
 * settings) and a separate blob store for character photos picked from the player's computer.
 * Nothing here ever leaves the browser — no network calls, no server.
 *
 * NOTE on file:// persistence: browsers key IndexedDB storage to the page's exact file path
 * (Chrome) or share it loosely across all local files (older Firefox behavior varies). Moving or
 * renaming this HTML file after first use can appear to "reset" saved content/images — that's a
 * browser storage boundary, not a bug in this file.
 */

var Store = (function () {
  'use strict';

  var DB_NAME = 'dgp-personality-standalone';
  var DB_VERSION = 1;
  var CONTENT_STORE = 'content';
  var IMAGE_STORE = 'images';
  var CONTENT_KEY = 'current';

  var dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = function () {
        var db = request.result;
        if (!db.objectStoreNames.contains(CONTENT_STORE)) {
          db.createObjectStore(CONTENT_STORE);
        }
        if (!db.objectStoreNames.contains(IMAGE_STORE)) {
          db.createObjectStore(IMAGE_STORE);
        }
      };
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
    return dbPromise;
  }

  function tx(storeName, mode) {
    return open().then(function (db) {
      return db.transaction(storeName, mode).objectStore(storeName);
    });
  }

  function reqToPromise(request) {
    return new Promise(function (resolve, reject) {
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
  }

  function getContent() {
    return tx(CONTENT_STORE, 'readonly').then(function (store) {
      return reqToPromise(store.get(CONTENT_KEY));
    });
  }

  function saveContent(content) {
    return tx(CONTENT_STORE, 'readwrite').then(function (store) {
      return reqToPromise(store.put(content, CONTENT_KEY));
    });
  }

  function saveImage(id, blob) {
    return tx(IMAGE_STORE, 'readwrite').then(function (store) {
      return reqToPromise(store.put(blob, id));
    });
  }

  function getImage(id) {
    return tx(IMAGE_STORE, 'readonly').then(function (store) {
      return reqToPromise(store.get(id));
    });
  }

  function deleteImage(id) {
    return tx(IMAGE_STORE, 'readwrite').then(function (store) {
      return reqToPromise(store.delete(id));
    });
  }

  return {
    getContent: getContent,
    saveContent: saveContent,
    saveImage: saveImage,
    getImage: getImage,
    deleteImage: deleteImage,
  };
})();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = Store;
}

/**
 * Access gate: a soft, client-side "who has this file" gate — NOT real security (this is a static
 * offline HTML file with no server, so the codes and the unlock logic are readable in the page
 * source by anyone who looks). It exists so a code shared with family/friends only works for the
 * duration the admin intended, not to withstand a deliberate bypass attempt.
 *
 * Four fixed codes, each unlocking this browser for a different duration. The admin (whoever has
 * this file first) opens the "קודי גישה" panel on the gate screen to see all four and copy
 * whichever one to send. Change ACCESS_CODES below to set your own codes.
 */
var Gate = (function () {
  'use strict';

  var STORAGE_KEY = 'dgp-personality-access';

  var ACCESS_CODES = [
    { id: 'threeDays', label: '3 ימים', code: '4127י', days: 3 },
    { id: 'week', label: 'שבוע', code: '8350ש', days: 7 },
    { id: 'month', label: 'חודש', code: '3018ח', days: 30 },
    { id: 'forever', label: 'תמיד', code: '0583217796', days: null },
  ];

  function readSaved() {
    var raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      return null;
    }
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function hasValidAccess() {
    var saved = readSaved();
    return !!saved && (saved.expiresAt === null || Date.now() < saved.expiresAt);
  }

  // Only ever true on the device that unlocked with the "forever" code — i.e. the admin's own
  // device. Recipients who unlocked with a 3-day/week/month code get this back as false, so the
  // "show me the codes" entry point never renders for them at all (see [[dgp-standalone-builds]]
  // gate design: the codes still exist in the page source for anyone who opens dev tools, but the
  // UI itself gives ordinary recipients no path to them).
  function isAdmin() {
    var saved = readSaved();
    return !!saved && saved.tier === 'forever' && hasValidAccess();
  }

  function tryUnlock(inputCode) {
    var trimmed = (inputCode || '').trim();
    var match = null;
    for (var i = 0; i < ACCESS_CODES.length; i++) {
      if (ACCESS_CODES[i].code === trimmed) {
        match = ACCESS_CODES[i];
        break;
      }
    }
    if (!match) return false;

    var expiresAt = match.days === null ? null : Date.now() + match.days * 24 * 60 * 60 * 1000;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ expiresAt: expiresAt, tier: match.id }));
    } catch (e) {
      // localStorage unavailable (private browsing etc.) — access still granted for this load.
    }
    return true;
  }

  return {
    codes: ACCESS_CODES,
    hasValidAccess: hasValidAccess,
    isAdmin: isAdmin,
    tryUnlock: tryUnlock,
  };
})();

    },
    wrongGuess: function () {

    gainPoints: function () {

      var fade = lifeT > 0.7 ? 1 - (lifeT - 0.7) / 0.3 : 1;

      for (var i = 0; i < particles.length; i++) {

        p.vy += 0.045;
        p.vx *= 0.995;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.spin;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = fade;
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      if (elapsed < DURATION_MS) {
        rafId = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }
    rafId = requestAnimationFrame(frame);

    return function cleanup() {
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
    };

      html += '<p class="ui-text-dimmed">עדיין לא נוספו שאלות.</p>';
    } else {
      html += '<table class="ui-table"><thead><tr><th>שאלה</th><th>פעילה</th><th></th></tr></thead><tbody>';
      questions.forEach(function (q) {
        var on = q.status === 'Active';
        html += '<tr><td>' + esc(q.title) + '</td><td>' +
          '<label class="ui-switch' + (on ? ' ui-switch--on' : '') + '" data-action="toggle-question" data-id="' + q.id + '">' +
          '<span class="ui-switch-track"><span class="ui-switch-thumb"></span></span></label></td>' +
          '<td><button class="ui-icon-btn ui-icon-btn--danger" data-action="delete-question" data-id="' + q.id + '" aria-label="מחק שאלה">' + icon('trash', 16) + '</button></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';

    // Name matching settings
    html += '<div class="ui-paper ui-stack">';
    html += '<h3 style="font-size:16px">התאמת שמות</h3>';
    html += '<label class="ui-switch' + (draft.partialMatchingEnabled ? ' ui-switch--on' : '') + '" data-action="toggle-partial-matching">' +
      '<span class="ui-switch-track"><span class="ui-switch-thumb"></span></span>' +
      '<span><div style="font-weight:600;font-size:14px">אפשר התאמה חלקית לשמות מרובי מילים</div>' +
      '<div class="ui-field-desc">למשל "משה כהן" יתאים גם לניחוש "משה" או "כהן" בלבד</div></span></label>';

    html += '<div class="ui-stack ui-stack--xs">';
    html += '<p style="font-weight:600;font-size:14px">מילים להתעלם מהן בתחילת השם</p>';
    html += '<div class="ui-group">';
    draft.ignoreWords.forEach(function (w) {
      html += '<span class="ui-pill">' + esc(w) + '<button class="ui-pill-remove" data-action="remove-ignore-word" data-word="' + esc(w) + '" aria-label="הסר">' + icon('x', 12, 2.5) + '</button></span>';
    });
    html += '</div>';
    html += '<div class="ui-group">' +
      '<input id="ignore-word-input" class="ui-input" style="flex:1" placeholder="הוסיפו מילה, למשל: גננת" value="' + esc(state.ui.newIgnoreWord) + '" data-bind="newIgnoreWord" />' +
      '<button class="ui-btn ui-btn--light" data-action="add-ignore-word">' + icon('plus', 16) + ' הוסף מילה</button>' +
      '<button class="ui-btn ui-btn--subtle" data-action="reset-ignore-words">' + icon('refresh', 16) + ' שחזר ברירת מחדל</button></div>';
    html += '</div>';
    html += '<button class="ui-btn" style="align-self:flex-start" data-action="save-settings">שמור</button>';
    html += '</div>';

    // Characters
    html += '<div class="ui-paper ui-stack">';
    html += '<div class="ui-group ui-group--between"><h3 style="font-size:16px">דמויות</h3>' +
      '<button class="ui-btn" data-action="new-character"' + (activeQ.length === 0 ? ' disabled' : '') + '>' + icon('plus', 16) + ' הוספת דמות</button></div>';

    if (activeQ.length === 0) {
      html += '<p class="ui-text-dimmed">יש להוסיף לפחות שאלה פעילה אחת לפני הוספת דמויות.</p>';
    } else if (characters.length === 0) {
      html += '<p class="ui-text-dimmed">עדיין לא נוספו דמויות.</p>';
    } else {
      html += '<table class="ui-table"><thead><tr><th></th><th>שם</th><th>תשובות</th><th></th></tr></thead><tbody>';
      characters.forEach(function (c) {
        var answeredCount = activeQ.filter(function (q) { return Object.prototype.hasOwnProperty.call(c.answers, q.id); }).length;
        var isComplete = answeredCount === activeQ.length;
        var src = characterImageSrc(c);
        html += '<tr><td><span class="ui-avatar">' + (src ? '<img src="' + src + '" alt="" />' : esc(c.title.charAt(0))) + '</span></td>' +
          '<td>' + esc(c.title) + '</td>' +
          '<td><span class="' + (isComplete ? 'ui-text-dimmed' : '') + '" style="' + (isComplete ? '' : 'color:var(--mantine-color-red-6)') + '">' +
          answeredCount + '/' + activeQ.length + (isComplete ? '' : ' — לא ישתתף עד להשלמת התשובות') + '</span></td>' +
          '<td><div class="ui-group" style="gap:4px">' +
          '<button class="ui-icon-btn" data-action="edit-character" data-id="' + c.id + '" aria-label="ערוך דמות">' + icon('pencil', 16) + '</button>' +
          '<button class="ui-icon-btn ui-icon-btn--danger" data-action="delete-character" data-id="' + c.id + '" aria-label="מחק דמות">' + icon('trash', 16) + '</button>' +
          '</div></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>'; // characters paper

    html += '<div class="ui-group">';
    html += '<button class="ui-btn" data-action="go-setup"' + (Personality.canPublish(content) ? '' : ' disabled') + '>' + icon('playerPlay', 16) + ' התחלת משחק</button>';
    html += '</div>';

    html += '</div>'; // shell

    if (state.ui.characterModal) html += renderCharacterModal(activeQ);
    if (state.ui.deleteTarget) html += renderDeleteConfirm();

    return html;
  }

  function renderCharacterModal(activeQuestions) {
    var form = state.ui.characterForm;
    var src = form.imageId ? state.imageUrls[form.imageId] : form.previewUrl || null;
    var isNew = state.ui.characterModal === 'new';

    var html = '<div class="ui-modal-overlay"><div class="ui-modal" role="dialog" aria-modal="true">';
    html += '<div class="ui-modal-title">' + (isNew ? 'דמות חדשה' : 'עריכת דמות') + '</div>';
    html += '<div class="ui-stack">';
    html += '<div class="ui-field"><label class="ui-field-label">שם הדמות</label>' +
      '<input id="character-name-input" class="ui-input" value="' + esc(form.name) + '" data-bind="characterName" /></div>';

    html += '<div class="ui-field"><label class="ui-field-label">תמונה (לא חובה)</label>' +
      '<div class="ui-photo-picker">' +
      '<span class="ui-avatar ui-avatar--lg">' + (src ? '<img src="' + src + '" alt="" />' : esc((form.name || '?').charAt(0) || '?')) + '</span>' +
      '<label class="ui-btn ui-btn--light ui-btn--sm" for="character-photo-input" style="cursor:pointer">' + icon('upload', 14) + ' בחירת תמונה מהמחשב' +
      '<input type="file" id="character-photo-input" accept="image/png,image/jpeg,image/webp,image/gif" data-action="pick-photo" /></label>' +
      '</div><p class="ui-field-desc">התמונה נשמרת רק על המחשב הזה — לא נשלחת לשום שרת.</p></div>';

    html += '<div class="ui-stack ui-stack--xs"><p style="font-weight:600;font-size:14px">תשובות</p>';
    activeQuestions.forEach(function (q) {
      var val = !!form.answers[q.id];
      html += '<div class="ui-answer-row"><span class="ui-text-sm">' + esc(q.title) + '</span>' +
        '<label class="ui-switch' + (val ? ' ui-switch--on' : '') + '" data-action="toggle-character-answer" data-qid="' + q.id + '">' +
        '<span class="ui-switch-track"><span class="ui-switch-thumb"></span></span>' +
        '<span class="ui-switch-label">' + (val ? 'כן' : 'לא') + '</span></label></div>';
    });
    html += '</div>';

    html += '<div class="ui-group ui-group--end" style="margin-top:6px">' +
      '<button class="ui-btn ui-btn--subtle" data-action="close-character-modal">ביטול</button>' +
      '<button class="ui-btn" data-action="submit-character-modal">שמור</button></div>';
    html += '</div></div></div>';
    return html;
  }

  function renderDeleteConfirm() {
    var target = state.ui.deleteTarget;
    return (
      '<div class="ui-modal-overlay"><div class="ui-modal" style="max-width:360px" role="dialog" aria-modal="true">' +
      '<div class="ui-modal-title">מחיקה</div>' +
      '<p class="ui-text-sm">למחוק את "' + esc(target.title) + '"?</p>' +
      '<div class="ui-group ui-group--end" style="margin-top:16px">' +
      '<button class="ui-btn ui-btn--subtle" data-action="cancel-delete">ביטול</button>' +
      '<button class="ui-btn ui-btn--danger" data-action="confirm-delete">מחק</button></div></div></div>'
    );
  }

  // ------------------------------------------------------------------
  // Setup screen
  // ------------------------------------------------------------------

  function renderSetup() {
    var names = state.ui.playerNames;
    var html = '<div class="ui-topbar"><span class="ui-topbar-brand">' + icon('sparkles', 16) + ' ' + esc(GAME_NAME) + '</span>' +
      '<button class="ui-btn ui-btn--subtle ui-btn--sm" data-action="go-home">חזרה</button></div>';
    html += '<div class="ui-shell" style="max-width:420px">';
    html += '<div class="ui-paper ui-stack"><h3 class="ui-text-center">' + esc(GAME_NAME) + '</h3>';
    html += '<div class="ui-stack ui-stack--xs">';
    names.forEach(function (name, i) {
      html += '<div class="ui-group" style="flex-wrap:nowrap">' +
        '<input class="ui-input" style="flex:1" placeholder="שחקן/ית ' + (i + 1) + '" value="' + esc(name) + '" data-bind="playerName" data-index="' + i + '" />' +
        (names.length > 1 ? '<button class="ui-icon-btn ui-icon-btn--danger" data-action="remove-player" data-index="' + i + '" aria-label="הסר שחקן">' + icon('trash', 16) + '</button>' : '') +
        '</div>';
    });
    html += '</div>';
    html += '<button class="ui-btn ui-btn--light ui-btn--block" data-action="add-player">' + icon('plus', 16) + ' הוספת שחקן/ית</button>';
    // Not disabled from render-time state: typing a name updates state.ui.playerNames without a
    // re-render (to preserve focus/caret), so a baked-in `disabled` attribute here would go stale
    // the moment the player types — startGame() itself validates and no-ops when empty.
    html += '<button class="ui-btn ui-btn--block" data-action="start-game">התחל משחק</button>';
    html += '</div></div>';
    return html;
  }

  // ------------------------------------------------------------------
  // Play screen
  // ------------------------------------------------------------------

  function activePlayers() {
    return state.session.players.filter(function (p) { return p.status === 'Active'; }).sort(function (a, b) { return a.joinOrder - b.joinOrder; });
  }

  function renderPlay() {
    var session = state.session;
    var content = state.content;
    var gs = session.gameState;
    var ui = state.ui;
    var charactersById = {};
    content.characters.forEach(function (c) { charactersById[c.id] = c; });
    var questionsById = {};
    content.questions.forEach(function (q) { questionsById[q.id] = q; });

    var players = activePlayers();
    var selector = players.length > 0 ? players[session.state.currentTurn % players.length] : null;
    var usedIds = {};
    gs.usedQuestionIds.forEach(function (id) { usedIds[id] = true; });

    var html = '<div class="pg">';

    // header
    html += '<div class="pg__header"><div class="pg__header-title">' +
      '<p class="pg__eyebrow">' + icon('sparkles', 13, 2.2) + ' משחק אישיות</p>' +
      '<h3 class="pg__header-name">' + esc(GAME_NAME) + '</h3></div>';
    html += '<div class="pg__header-actions">' +
      '<button class="pg__pause-btn" data-action="request-quit-game" aria-label="חזרה לדף הבית" title="חזרה לדף הבית">' + icon('home', 17) + '</button>' +
      '<span class="pg__round-pill' + (gs.isPaused ? ' pg__round-pill--paused' : '') + '">' + (gs.isPaused ? 'מושהה' : 'סבב ' + session.state.currentRound) + '</span>' +
      '<button class="pg__pause-btn" data-action="toggle-pause" aria-label="' + (gs.isPaused ? 'המשך משחק' : 'השהה משחק') + '">' +
      icon(gs.isPaused ? 'playerPlay' : 'playerPause', 18) + '</button>' +
      '<button class="ui-help-btn" data-action="open-instructions" aria-label="הוראות המשחק" title="הוראות המשחק">?</button>' +
      '</div></div>';

    if (ui.confirmQuit) html += renderQuitConfirm();
    if (ui.showInstructions) html += renderInstructionsModal(false);

    html += '<div class="pg__stage' + (gs.isPaused ? ' pg__stage--paused' : '') + '">';

    // toolbar
    html += '<div class="pg__toolbar"><div class="pg__toolbar-row">';

    // players panel
    var density = Personality.computePlayerDensity(session.players.length);
    var maxScore = Math.max.apply(null, [0].concat(session.players.map(function (p) { return p.currentScore; })));
    html += '<div class="pg__player-chip-row pg__player-chip-row--' + density + '" aria-label="שחקנים">';
    session.players.forEach(function (p) {
      var isLeader = maxScore > 0 && p.currentScore === maxScore;
      var isSelected = !!ui.selectedPlayerIds[p.id];
      var isTurn = selector && p.id === selector.id;
      var flash = ui.scoreFlashes[p.id];
      // The avatar shows a generic person icon, not the name's initial — the full name already
      // renders once right below it, and for short names the initial and the name were reading
      // as the same text twice.
      html += '<button type="button" class="pg__player-col' + (isSelected ? ' pg__player-col--selected' : '') + '" data-action="select-player" data-id="' + p.id + '" aria-pressed="' + isSelected + '">' +
        '<span class="pg__player-avatar-ring' + (isTurn ? ' pg__player-avatar-ring--turn' : '') + '"' + (isTurn ? ' title="התור שלו/ה לבחור שאלה"' : '') + '>' +
        '<span class="pg__player-chip-avatar">' + icon('user', 13, 2.4) + '</span>' +
        (isLeader ? '<span class="pg__player-crown-badge">' + icon('crown', 10, 2) + '</span>' : '') +
        (isSelected ? '<span class="pg__player-selected-badge">' + icon('check', 9, 3) + '</span>' : '') +
        (flash !== undefined ? '<span class="pg__player-float' + (flash > 0 ? ' pg__player-float--gain' : ' pg__player-float--lose') + '" aria-hidden="true">' + (flash > 0 ? '+' + flash : flash) + '</span>' : '') +
        '</span><span class="pg__player-name-text">' + esc(p.displayName) + '</span>' +
        '<span class="pg__player-chip-score' + (flash !== undefined ? ' pg__player-score--flash' : '') + '">' + p.currentScore + ' נק\'</span></button>';
    });
    html += '</div>';

    html += '<div class="pg__toolbar-divider" aria-hidden="true"></div>';

    // questions panel
    var questions = content.questions.filter(function (q) { return q.status === 'Active'; }).sort(function (a, b) { return a.displayOrder - b.displayOrder; });
    var allUsed = questions.length > 0 && questions.every(function (q) { return usedIds[q.id]; });
    html += '<div class="pg__toolbar-questions"><span class="pg__toolbar-label">שאלות</span><ul class="pg__question-list">';
    questions.forEach(function (q) {
      var used = !!usedIds[q.id];
      html += '<li><button type="button" class="pg__question-btn" data-action="select-question" data-id="' + q.id + '"' +
        (used || !selector ? ' disabled' : '') + ' title="' + esc(q.title) + '">' + esc(q.title) + '</button></li>';
    });
    html += '</ul>' + (allUsed ? '<p class="pg__question-empty">כל השאלות נשאלו.</p>' : '') + '</div>';

    html += '</div>'; // toolbar-row
    // Persistent legend for the turn ring — otherwise there's no way for players to learn what
    // it means (it's shown once per round on whoever's turn it is to pick the next question).
    html += '<p class="pg__turn-legend"><span class="pg__turn-legend-swatch" aria-hidden="true"></span>הטבעת הסגולה סביב התמונה מסמנת את מי שתורו/ה לבחור שאלה.</p>';
    html += '<p class="pg__toolbar-hint">' + (Object.keys(ui.selectedPlayerIds).length > 0
      ? 'עכשיו לחצו על כרטיס בלוח כדי לנחש מי מסתתר מאחוריו.'
      : 'לחצו על שם השחקן (או כמה שחקנים ביחד) שרוצים לנחש, ואז על כרטיס בלוח.') + '</p>';
    html += '</div>'; // toolbar

    // board
    var boardDensity = Personality.computeBoardDensity(gs.windows.length);
    var cols = Personality.computeBoardColumns(gs.windows.length);
    html += '<div class="pg__board-panel"><div class="pg__table"><div class="pg__board pg__board--' + boardDensity + '" style="--cols:' + cols + '">';
    gs.windows.forEach(function (win) {
      var character = charactersById[win.characterContentId];
      // Only reveal the photo once the window is actually open — a closed card must stay a
      // mystery regardless of whether the character has a photo (the original app's board
      // showed the photo even on a closed card, which gave the character away before anyone
      // guessed; deliberately not porting that here).
      var src = character && win.isOpen ? characterImageSrc(character) : null;
      var clues = gs.usedQuestionIds.filter(function (id) { return id in win.reveals; }).map(function (id) {
        return { answer: win.reveals[id], title: (questionsById[id] && questionsById[id].title) || '?' };
      });
      var isRevealing = ui.justRevealedIndex === win.index;
      // Once a card is revealed and the character has a photo, let the photo fill the whole
      // card (poster-style) instead of a small cropped circle — the small circle read as an
      // afterthought once you could actually see who it was.
      var isPhotoCard = win.isOpen && !!src;
      var clueListHtml = '';
      if (clues.length > 0) {
        clueListHtml = '<ul class="pg__clue-list">';
        clues.forEach(function (clue) {
          clueListHtml += '<li class="pg__clue-chip' + (clue.answer ? ' pg__clue-chip--yes' : ' pg__clue-chip--no') + '">' + icon(clue.answer ? 'check' : 'x', 12, 3) + '<span>' + esc(clue.title) + '</span></li>';
        });
        clueListHtml += '</ul>';
      }

      html += '<button type="button" class="pg__card' + (win.isOpen ? ' pg__card--open' : '') + (isRevealing ? ' pg__card--revealing' : '') + (isPhotoCard ? ' pg__card--photo' : '') +
        '" data-action="select-window" data-index="' + win.index + '"' + (win.isOpen ? ' disabled' : '') +
        ' aria-label="' + (win.isOpen ? esc(character ? character.title : 'דמות נחשפה') : 'כרטיס, ' + win.currentValue + ' נק\'') + '">';
      html += '<span class="pg__card-number" aria-hidden="true">' + (win.index + 1) + '</span>';

      if (isPhotoCard) {
        html += '<img class="pg__card-photo-bg" src="' + src + '" alt="" />';
        html += '<span class="pg__card-photo-overlay"><span class="pg__card-name">' + esc(character ? character.title : 'דמות לא ידועה') + '</span>' + clueListHtml + '</span>';
      } else {
        html += '<span class="pg__card-sheen" aria-hidden="true"></span>';
        // Closed card: a bare "?" glyph, not the circular avatar chrome — there's no character
        // to frame yet, so the circle read as an empty placeholder rather than a mystery.
        html += win.isOpen
          ? '<span class="pg__card-avatar">' + esc((character ? character.title : '?').charAt(0)) + '</span>'
          : '<span class="pg__card-mystery" aria-hidden="true">?</span>';
        if (win.isOpen) {
          html += '<span class="pg__card-name">' + esc(character ? character.title : 'דמות לא ידועה') + '</span>';
        } else {
          html += '<span class="pg__card-value"><span class="pg__card-value-num">' + win.currentValue + '</span><span class="pg__card-value-unit">נק\'</span></span>';
        }
        html += clueListHtml;
      }
      html += '</button>';
    });
    html += '</div></div></div>'; // board, table, board-panel

    html += '</div>'; // stage

    if (ui.guessWindowIndex !== null) html += renderGuessModal();

    html += '</div>'; // pg
    return html;
  }

  /** Static help content — from the game's own instructions document, not user data, so no
   * esc() needed on the Hebrew copy itself (only ever written here, never interpolated).
   * The moderator guide only makes sense while setting up content, not mid-game — the play
   * screen's help button passes includeModeratorGuide:false and shows the player-facing half only. */
  function renderInstructionsModal(includeModeratorGuide) {
    var body =
      '<h4>מטרת המשחק</h4>' +
      '<p>לגלות איזו דמות מסתתרת מאחורי כל חלון, באמצעות המידע שמתקבל מהשאלות. בכל שאלה נחשף רמז חדש על כל הדמויות שעדיין מוסתרות. יש להחליט מתי יש מספיק מידע כדי לנחש — ניחוש מוקדם יכול להעניק יותר נקודות, אך גם עלול לגרום להפסד נקודות אם הוא שגוי.</p>' +

      '<h4>איך משחקים?</h4>' +
      '<ul>' +
      '<li>בתחילת המשחק נפתחים על המסך חלונות ממוספרים, וכל חלון מסתיר דמות.</li>' +
      '<li>בכל סבב מוצגת שאלה אחת. ליד כל חלון מופיעה התשובה של אותה דמות לשאלה (כן / לא).</li>' +
      '<li>אחרי הצגת התשובות, כל משתתף רשאי להכריז שהוא רוצה לנחש — ולציין את מספר החלון ואת שם הדמות שלדעתו מסתתרת מאחוריו.</li>' +
      '<li>ניחוש נכון פותח את החלון ומזכה בנקודות. ניחוש שגוי לא פותח את החלון, ומוריד נקודות.</li>' +
      '<li>המשחק ממשיך עד שכל החלונות נחשפים.</li>' +
      '</ul>' +

      '<h4>ניקוד</h4>' +
      '<ul>' +
      '<li>ניחוש נכון מזכה במספר הנקודות הנוכחי של הדמות.</li>' +
      '<li>ערך כל דמות יורד ב-1 לאחר כל שאלה שנשאלת.</li>' +
      '<li>ניחוש שגוי מוריד 10 נקודות — ייתכן ניקוד שלילי.</li>' +
      '</ul>' +

      '<h4>טיפים</h4>' +
      '<ul>' +
      '<li>לא תמיד כדאי למהר לנחש — לפעמים שווה להמתין לעוד שאלה כדי להיות בטוחים יותר.</li>' +
      '<li>נסו לשלב את כל הרמזים לפני קבלת החלטה.</li>' +
      '</ul>';

    if (includeModeratorGuide) {
      body +=
        '<hr />' +
        '<h4>מדריך למנהל/ת המשחק</h4>' +

        '<h5>לפני תחילת המשחק</h5>' +
        '<ul>' +

    }

    return (
      '<div class="ui-modal-overlay"><div class="ui-modal ui-instructions-modal" role="dialog" aria-modal="true">' +

      '<div class="ui-instructions">' + body + '</div>' +
      '<div class="ui-group ui-group--end" style="margin-top:16px">' +
      '<button class="ui-btn" data-action="close-instructions">הבנתי</button>' +

    );
  }

  function renderQuitConfirm() {
    return (
      '<div class="ui-modal-overlay"><div class="ui-modal" style="max-width:360px" role="dialog" aria-modal="true">' +
      '<div class="ui-modal-title">לצאת מהמשחק?</div>' +
      '<p class="ui-text-sm">הניקוד וההתקדמות של הסבב הנוכחי יאבדו. התוכן (דמויות ושאלות) יישאר שמור.</p>' +
      '<div class="ui-group ui-group--end" style="margin-top:16px">' +
      '<button class="ui-btn ui-btn--subtle" data-action="cancel-quit">ביטול</button>' +
      '<button class="ui-btn ui-btn--danger" data-action="confirm-quit">יציאה לדף הבית</button></div></div></div>'
    );
  }

  function renderGuessModal() {
    var ui = state.ui;
    var selected = state.session.players.filter(function (p) { return ui.selectedPlayerIds[p.id]; });
    var guesserName = formatGuesserNames(selected.map(function (p) { return p.displayName; }));
    var result = ui.guessResult;

    var html = '<div class="ui-modal-overlay" style="background:color-mix(in srgb, #fff 65%, transparent);backdrop-filter:blur(8px)">' +
      '<div class="ui-modal" style="border-radius:22px;max-width:400px" role="dialog" aria-modal="true">' +
      '<div class="ui-modal-title">' + (result === null ? 'הניחוש של ' + esc(guesserName) : 'התוצאה') + '</div>';

    if (result === null) {
      html += '<p class="ui-text-dimmed ui-text-sm pg__guess-guesser">מי מסתתר מאחורי הכרטיס? ' + esc(guesserName) + ' מקלידים את הניחוש.</p>';
      html += '<input id="guess-input" class="ui-input" autocomplete="off" placeholder="הקלידו את שם הדמות…" />';
      html += '<div class="ui-group ui-group--end" style="margin-top:20px">' +
        '<button class="ui-btn ui-btn--subtle" data-action="cancel-guess">ביטול</button>' +
        '<button class="ui-btn" data-action="submit-guess">אשרו ניחוש</button></div>';
    } else {
      html += '<div class="pg__outcome' + (result ? ' pg__outcome--correct' : ' pg__outcome--wrong') + '">' +
        '<span class="pg__outcome-badge' + (result ? ' pg__outcome-badge--correct' : ' pg__outcome-badge--wrong') + '">' +
        icon(result ? 'sparkles' : 'x', result ? 24 : 20, result ? 2 : 2.5) + '</span>' +
        '<span class="pg__outcome-text">' + (result ? 'ניחוש מדויק!' : 'הניחוש שגוי.') + '</span></div>';
      if (result) {
        html += '<div class="ui-group" style="justify-content:center;margin-top:16px"><button class="ui-btn" data-action="close-guess-modal">המשך משחק</button></div>';

  // ------------------------------------------------------------------
  // Results screen
  // ------------------------------------------------------------------

  function renderResults() {
    var session = state.session;
    var winners = session.players.filter(function (p) { return p.isWinner; });
    var players = session.players.slice().sort(function (a, b) { return b.currentScore - a.currentScore; });
    var phase = state.ui.resultsPhase;
    var celebrating = phase === 'celebrating' || phase === 'leaving';

    var html = '<div class="ui-topbar"><span class="ui-topbar-brand">' + icon('sparkles', 16) + ' ' + esc(GAME_NAME) + '</span></div>';
    html += '<div class="results ui-shell ui-text-center">';

    if (celebrating && winners.length > 0) {
      var names = formatGuesserNames(winners.map(function (p) { return p.displayName; }));
      html += '<div class="results-celebration' + (phase === 'leaving' ? ' results-celebration--leaving' : '') + '">' +
        '<canvas class="results-confetti" id="results-confetti"></canvas>' +
        '<div class="results-celebration__card">' +
        '<span class="results-celebration__trophy">' + icon('trophy', 46, 1.6) + '</span>' +
        '<p class="results-celebration__eyebrow">' + (winners.length > 1 ? 'תיקו!' : 'יש לנו מנצח/ת!') + '</p>' +
        '<h2 class="results-celebration__name">' + esc(names) + '</h2>' +
        '<p class="results-celebration__score">' + winners[0].currentScore + ' <span>נק\'</span></p>' +
        '<p class="results-celebration__sub">כל הכבוד!</p>' +
        '</div></div>';
    }

    html += '<span style="color:var(--mantine-color-accent-6);display:inline-flex">' + icon('trophy', 48, 1.5) + '</span>';
    html += '<h2>תוצאות המשחק</h2>';
    html += '<div class="ui-stack ui-stack--xs" style="max-width:420px;margin:16px auto 0;text-align:right">';
    players.forEach(function (p) {
      html += '<div class="ui-paper' + (p.isWinner ? ' results-row--winner' : '') + '" style="padding:14px 16px">' +
        '<div class="ui-group ui-group--between"><div class="ui-group" style="gap:8px">' +
        '<strong>' + esc(p.displayName) + '</strong>' +
        (p.isWinner ? '<span class="ui-badge ui-badge--accent">' + icon('crown', 12) + ' מנצח/ת</span>' : '') +
        '</div><strong>' + p.currentScore + ' נק\'</strong></div></div>';
    });
    html += '</div>';

    html += '<div class="ui-group" style="justify-content:center;margin-top:24px">' +
      '<button class="ui-btn" data-action="play-again">שחקו שוב</button>' +
      '<button class="ui-btn ui-btn--light" data-action="edit-content">עריכת תוכן</button>' +
      '<button class="ui-btn ui-btn--subtle" data-action="go-home">בית</button></div>';

    html += '</div>';
    return html;
  }

  /**
   * Runs after every render of the results screen, including stray/repeat ones — a re-render
   * while already celebrating must never restart the sequence (that's what caused the
   * flashing/flicker: leftover reveal/flash timers from the winning guess firing after the
   * screen had already switched to results, forcing a fresh render that re-triggered the whole
   * celebration from scratch). celebrationStarted below is the guard against exactly that.
   */
  function afterRenderResults() {
    var ui = state.ui;
    var winners = state.session.players.filter(function (p) { return p.isWinner; });

    if (ui.resultsPhase === 'idle') {
      if (winners.length === 0) {
        ui.resultsPhase = 'done';
        return;
      }
      ui.resultsPhase = 'celebrating';
      render();
      return;
    }

    if (ui.resultsPhase === 'celebrating' && !ui.celebrationStarted) {
      ui.celebrationStarted = true;
      startConfettiAndApplause();
    }
  }

  function startConfettiAndApplause() {
    var canvas = document.getElementById('results-confetti');
    if (canvas) state.ui.confettiCleanup = Confetti.start(canvas);
    Sound.playApplause();
    setTimeout(function () {
      state.ui.resultsPhase = 'leaving';
      render();
      setTimeout(function () {
        state.ui.resultsPhase = 'done';
        if (state.ui.confettiCleanup) state.ui.confettiCleanup();
        render();
      }, CELEBRATION_EXIT_MS);
    }, CELEBRATION_MS);
  }

  // ------------------------------------------------------------------
  // Actions — content manager
  // ------------------------------------------------------------------

  function addQuestionWithTitle(text) {
    state.content.questions.push({ id: Personality.uuid(), title: text, status: 'Active', displayOrder: state.content.questions.length });
    persistContent();
  }

  function addQuestion() {
    var text = (state.ui.questionText || '').trim();
    if (!text) return;
    addQuestionWithTitle(text);
    state.ui.questionText = '';
    render();
  }

  function addPresetQuestion(text) {
    var alreadyAdded = state.content.questions.some(function (q) { return q.title === text; });
    if (alreadyAdded) return;
    addQuestionWithTitle(text);
    render();
  }

  function toggleQuestion(id) {
    var q = state.content.questions.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    q.status = q.status === 'Active' ? 'Archived' : 'Active';
    persistContent();
    render();
  }

  function requestDeleteQuestion(id) {
    var q = state.content.questions.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    state.ui.deleteTarget = { kind: 'question', id: id, title: q.title };
    render();
  }

  function requestDeleteCharacter(id) {
    var c = state.content.characters.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    state.ui.deleteTarget = { kind: 'character', id: id, title: c.title };
    render();
  }

  function confirmDelete() {
    var target = state.ui.deleteTarget;
    if (!target) return;
    if (target.kind === 'question') {
      state.content.questions = state.content.questions.filter(function (q) { return q.id !== target.id; });
      state.content.characters.forEach(function (c) { delete c.answers[target.id]; });
    } else {
      var c = state.content.characters.filter(function (x) { return x.id === target.id; })[0];
      if (c && c.imageId) Store.deleteImage(c.imageId).catch(function () {});
      state.content.characters = state.content.characters.filter(function (x) { return x.id !== target.id; });
    }
    state.ui.deleteTarget = null;
    persistContent();
    render();
  }

  function addIgnoreWord() {
    var draft = ensureSettingsDraft();
    var word = (state.ui.newIgnoreWord || '').trim();
    if (word && draft.ignoreWords.indexOf(word) === -1) draft.ignoreWords.push(word);
    state.ui.newIgnoreWord = '';
    render();
  }

  function removeIgnoreWord(word) {
    var draft = ensureSettingsDraft();
    draft.ignoreWords = draft.ignoreWords.filter(function (w) { return w !== word; });
    render();
  }

  function resetIgnoreWords() {
    var draft = ensureSettingsDraft();
    draft.ignoreWords = Personality.DEFAULT_IGNORE_WORDS.slice();
    render();
  }

  function togglePartialMatching() {
    var draft = ensureSettingsDraft();
    draft.partialMatchingEnabled = !draft.partialMatchingEnabled;
    render();
  }

  function saveSettings() {
    var draft = ensureSettingsDraft();
    state.content.settings.partialMatchingEnabled = draft.partialMatchingEnabled;
    state.content.settings.ignoreWords = draft.ignoreWords.slice();
    persistContent();
    Notif.notify('success', 'ההגדרות נשמרו בהצלחה.');
    render();
  }

  /** Every active question must be a key in `answers` (even false) the moment the form opens —
   * mirrors CharacterFormModal's `initial[question.id] = existing?.answers[question.id] ?? false`
   * so leaving a switch untouched still counts as an explicit "no", not a missing answer. */
  function seededAnswers(existing) {
    var answers = {};
    Personality.activeQuestions(state.content).forEach(function (q) {
      answers[q.id] = (existing && existing[q.id]) || false;
    });
    return answers;
  }

  function openNewCharacterModal() {
    state.ui.characterModal = 'new';
    state.ui.characterForm = { id: null, name: '', answers: seededAnswers(null), imageId: null, pendingFile: null, previewUrl: null };
    render();
  }

  function openEditCharacterModal(id) {
    var c = state.content.characters.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    state.ui.characterModal = c;
    state.ui.characterForm = { id: c.id, name: c.title, answers: seededAnswers(c.answers), imageId: c.imageId, pendingFile: null, previewUrl: null };
    render();
  }

  function closeCharacterModal() {
    var form = state.ui.characterForm;
    if (form && form.previewUrl) URL.revokeObjectURL(form.previewUrl);
    state.ui.characterModal = null;
    state.ui.characterForm = null;
    render();
  }

  function pickCharacterPhoto(file) {
    if (!file) return;
    var allowed = { 'image/png': 1, 'image/jpeg': 1, 'image/webp': 1, 'image/gif': 1 };
    if (!allowed[file.type]) {
      Notif.notify('error', 'סוג קובץ לא נתמך. יש לבחור PNG, JPEG, WEBP או GIF.');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      Notif.notify('error', 'התמונה גדולה מדי (מקסימום 5MB).');
      return;
    }
    var form = state.ui.characterForm;
    if (form.previewUrl) URL.revokeObjectURL(form.previewUrl);
    form.pendingFile = file;
    form.previewUrl = URL.createObjectURL(file);
    form.imageId = null; // preview takes precedence over any previously-saved image id
    render();
  }

  function toggleCharacterAnswer(questionId) {
    var form = state.ui.characterForm;
    form.answers[questionId] = !form.answers[questionId];
    render();
  }

  function submitCharacterModal() {
    var form = state.ui.characterForm;
    var name = (form.name || '').trim();
    if (!name) {
      Notif.notify('warning', 'יש להזין שם לדמות.');
      return;
    }

    function finish(imageId) {
      if (form.id) {
        var existing = state.content.characters.filter(function (x) { return x.id === form.id; })[0];
        var oldImageId = existing.imageId;
        existing.title = name;
        existing.answers = form.answers;
        existing.imageId = imageId;
        if (oldImageId && oldImageId !== imageId) Store.deleteImage(oldImageId).catch(function () {});
      } else {
        state.content.characters.push({
          id: Personality.uuid(), title: name, status: 'Active',
          displayOrder: state.content.characters.length, imageId: imageId, answers: form.answers,
        });
      }
      persistContent();
      if (form.previewUrl) URL.revokeObjectURL(form.previewUrl);
      state.ui.characterModal = null;
      state.ui.characterForm = null;
      render();
    }

    if (form.pendingFile) {
      var newId = Personality.uuid();
      Store.saveImage(newId, form.pendingFile).then(function () {
        state.imageUrls[newId] = URL.createObjectURL(form.pendingFile);
        finish(newId);
      }).catch(function () {
        Notif.notify('error', 'שמירת התמונה נכשלה.');
      });
    } else {
      finish(form.imageId);
    }
  }

  // ------------------------------------------------------------------
  // Actions — setup
  // ------------------------------------------------------------------

  function addPlayerInput() {
    state.ui.playerNames.push('');
    render();
  }

  function removePlayerInput(index) {
    state.ui.playerNames.splice(index, 1);
    render();
  }

  function startGame() {
    var names = state.ui.playerNames.map(function (n) { return n.trim(); }).filter(Boolean);
    if (names.length === 0) return;
    state.session = Personality.startSession(state.content, names);
    state.ui.selectedPlayerIds = {};
    state.ui.guessWindowIndex = null;
    state.ui.guessResult = null;
    state.ui.justRevealedIndex = null;
    state.ui.scoreFlashes = {};
    state.screen = 'play';
    render();
    Sound.personality.gameStart();
  }

  // ------------------------------------------------------------------
  // Actions — play
  // ------------------------------------------------------------------

  /** Cancels the play screen's own animation timers — must happen before leaving it, otherwise
   * they fire later on whatever screen is showing by then and force an unwanted re-render. */
  function clearPlayTimers() {
    if (state.ui.revealTimer) { clearTimeout(state.ui.revealTimer); state.ui.revealTimer = null; }
    if (state.ui.flashTimer) { clearTimeout(state.ui.flashTimer); state.ui.flashTimer = null; }
  }

  function enterResultsScreen() {
    clearPlayTimers();
    state.ui.resultsPhase = 'idle';
    state.ui.celebrationStarted = false;
    state.screen = 'results';
  }

  function afterAction(actionResult, onSuccess) {
    if (!actionResult.success) {
      Notif.notify('warning', 'לא ניתן לבצע את הפעולה כרגע.');
      render();
      return;
    }
    onSuccess && onSuccess();
    if (state.session.status === 'Finished') {
      enterResultsScreen();
    }
    render();
  }

  function togglePause() {
    Sound.personality.click();
    var type = state.session.gameState.isPaused ? 'ResumeGame' : 'PauseGame';
    var result = Personality.processAction(state.session, state.content, { type: type, playerId: null, payload: {} });
    afterAction(result);
  }

  /** Lets the moderator leave a game in progress and get back to the home screen — there was
   * previously no way out of the play screen short of finishing the whole game. Confirmed first
   * since it discards the current session's score/progress (the saved content itself is untouched). */
  function requestQuitGame() {
    closeGuessModal();
    state.ui.confirmQuit = true;
    render();
  }

  function cancelQuit() {
    state.ui.confirmQuit = false;
    render();
  }

  function confirmQuitGame() {
    clearPlayTimers();
    state.ui.confirmQuit = false;
    state.session = null;
    goHome();
  }

  function selectQuestion(questionId) {
    var session = state.session;
    var players = activePlayers();
    var selector = players.length > 0 ? players[session.state.currentTurn % players.length] : null;
    if (!selector || session.gameState.isPaused || session.gameState.usedQuestionIds.indexOf(questionId) !== -1) return;
    Sound.personality.selectQuestion();
    var result = Personality.processAction(session, state.content, { type: 'SelectQuestion', playerId: selector.id, payload: { questionContentId: questionId } });
    afterAction(result);
  }

  function selectPlayer(playerId) {
    Sound.personality.selectPlayer();
    if (state.ui.selectedPlayerIds[playerId]) delete state.ui.selectedPlayerIds[playerId];
    else state.ui.selectedPlayerIds[playerId] = true;
    render();
  }

  function selectWindow(index) {
    var gs = state.session.gameState;
    if (gs.isPaused) return;
    if (gs.usedQuestionIds.length === 0) {
      Notif.notify('info', 'יש לחשוף לפחות שאלה אחת לפני שניתן לנחש.');
      render();
      return;
    }
    if (Object.keys(state.ui.selectedPlayerIds).length === 0) {
      Notif.notify('warning', 'יש לבחור לפחות שחקן אחד.');
      render();
      return;
    }
    Sound.personality.click();
    state.ui.guessResult = null;
    state.ui.guessWindowIndex = index;
    render();
  }

  function closeGuessModal() {
    if (state.ui.guessAutoCloseTimer) {
      clearTimeout(state.ui.guessAutoCloseTimer);
      state.ui.guessAutoCloseTimer = null;
    }
    state.ui.guessWindowIndex = null;
    state.ui.guessResult = null;
    state.ui.selectedPlayerIds = {};
    render();
  }

  function submitGuess() {
    var input = document.getElementById('guess-input');
    var text = input ? input.value.trim() : '';
    if (!text) return;
    Sound.personality.click();

    var content = state.content;
    var settings = content.settings;
    var charactersForIndex = content.characters.filter(function (c) {
      return state.session.gameState.windows.some(function (w) { return w.characterContentId === c.id; });
    }).map(function (c) { return { id: c.id, title: c.title }; });
    var aliasIndex = Personality.buildAliasIndex(charactersForIndex, settings.ignoreWords, settings.partialMatchingEnabled);
    var matchId = Personality.resolveCharacterId(text, aliasIndex);

    var playerIds = Object.keys(state.ui.selectedPlayerIds);
    var windowIndex = state.ui.guessWindowIndex;
    var scoresBefore = {};
    state.session.players.forEach(function (p) { scoresBefore[p.id] = p.currentScore; });

    var result = Personality.processAction(state.session, content, {
      type: 'DeclareGuess', playerId: null,
      payload: { windowIndex: windowIndex, characterContentId: matchId || Personality.uuid(), playerIds: playerIds },
    });

    if (!result.success) {
      Notif.notify('warning', 'לא ניתן לבצע את הפעולה כרגע.');
      render();
      return;
    }

    var correct = result.messages.indexOf('Correct guess.') !== -1;
    state.ui.guessResult = correct;
    if (correct) {
      state.ui.justRevealedIndex = windowIndex;
      Sound.personality.cardFlip();
      Sound.personality.correctGuess();
    } else {
      Sound.personality.wrongGuess();
    }

    var deltas = {};
    state.session.players.forEach(function (p) {
      var before = scoresBefore[p.id];
      if (before !== undefined && p.currentScore !== before) deltas[p.id] = p.currentScore - before;
    });
    if (Object.keys(deltas).length > 0) {
      state.ui.scoreFlashes = deltas;
      setTimeout(function () { correct ? Sound.personality.gainPoints() : Sound.personality.losePoints(); }, 220);
    }

    var justFinished = state.session.status === 'Finished';

    // These two timers only matter for board animations on the play screen — if this guess just
    // finished the game we're leaving that screen for good, so scheduling them would only leave
    // a stray render() to fire later on the results screen (that used to cause the whole
    // celebration sequence to flicker and restart from scratch).
    if (!justFinished) {
      if (state.ui.revealTimer) clearTimeout(state.ui.revealTimer);
      state.ui.revealTimer = setTimeout(function () { state.ui.justRevealedIndex = null; render(); }, REVEAL_FLIP_DURATION_MS);
      if (state.ui.flashTimer) clearTimeout(state.ui.flashTimer);
      state.ui.flashTimer = setTimeout(function () { state.ui.scoreFlashes = {}; render(); }, SCORE_FLASH_DURATION_MS);
    }

    if (justFinished) {
      enterResultsScreen();
    }
    render();

    // The result modal (right or wrong) always auto-dismisses back into the game on its own —
    // "המשך משחק" on a correct guess just lets an impatient moderator skip the wait. Skipped
    // entirely once the game is finished: there's no modal left, we've already moved on to the
    // results screen above.
    if (!justFinished) {
      if (state.ui.guessAutoCloseTimer) clearTimeout(state.ui.guessAutoCloseTimer);
      state.ui.guessAutoCloseTimer = setTimeout(function () {
        state.ui.guessAutoCloseTimer = null;
        if (state.ui.guessWindowIndex !== null) closeGuessModal();
      }, correct ? CORRECT_GUESS_AUTO_CLOSE_MS : WRONG_GUESS_AUTO_CLOSE_MS);
    }
  }

  // ------------------------------------------------------------------
  // Actions — navigation
  // ------------------------------------------------------------------

  function openInstructions() {
    state.ui.showInstructions = true;
    render();
  }

  function closeInstructions() {
    state.ui.showInstructions = false;
    render();
  }

  function goHome() {
    state.screen = 'home';
    state.ui.settingsDraft = null;
    render();
  }

  function goContent() {
    state.ui.settingsDraft = null;
    state.screen = 'content';
    render();
  }

  function goSetup() {
    if (!Personality.canPublish(state.content)) return;
    state.ui.playerNames = [''];
    state.screen = 'setup';
    render();
  }

  function playAgain() {
    state.session = null;
    goSetup();
  }

  // ------------------------------------------------------------------
  // Event delegation
  // ------------------------------------------------------------------

  var ACTIONS = {
    'submit-gate': submitGate,
    'toggle-gate-codes': toggleGateCodes,
    'copy-gate-code': copyGateCode,
    'go-home': goHome,
    'open-instructions': openInstructions,
    'close-instructions': closeInstructions,
    'go-content': goContent,
    'go-setup': goSetup,
    'play-again': playAgain,
    'edit-content': goContent,
    'add-question': addQuestion,
    'add-preset-question': function (el) { addPresetQuestion(el.getAttribute('data-text')); },
    'toggle-question': function (el) { toggleQuestion(el.getAttribute('data-id')); },
    'delete-question': function (el) { requestDeleteQuestion(el.getAttribute('data-id')); },
    'edit-character': function (el) { openEditCharacterModal(el.getAttribute('data-id')); },
    'delete-character': function (el) { requestDeleteCharacter(el.getAttribute('data-id')); },
    'new-character': openNewCharacterModal,
    'close-character-modal': closeCharacterModal,
    'submit-character-modal': submitCharacterModal,
    'toggle-character-answer': function (el) { toggleCharacterAnswer(el.getAttribute('data-qid')); },
    'cancel-delete': function () { state.ui.deleteTarget = null; render(); },
    'confirm-delete': confirmDelete,
    'add-ignore-word': addIgnoreWord,
    'remove-ignore-word': function (el) { removeIgnoreWord(el.getAttribute('data-word')); },
    'reset-ignore-words': resetIgnoreWords,
    'toggle-partial-matching': togglePartialMatching,
    'save-settings': saveSettings,
    'add-player': addPlayerInput,
    'remove-player': function (el) { removePlayerInput(Number(el.getAttribute('data-index'))); },
    'start-game': startGame,
    'toggle-pause': togglePause,
    'request-quit-game': requestQuitGame,
    'cancel-quit': cancelQuit,
    'confirm-quit': confirmQuitGame,
    'select-question': function (el) { selectQuestion(el.getAttribute('data-id')); },
    'select-player': function (el) { selectPlayer(el.getAttribute('data-id')); },
    'select-window': function (el) { selectWindow(Number(el.getAttribute('data-index'))); },
    'submit-guess': submitGuess,
    'cancel-guess': closeGuessModal,
    'close-guess-modal': closeGuessModal,
  };

  function onClick(event) {
    var el = event.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var handler = ACTIONS[el.getAttribute('data-action')];
    if (handler) handler(el);
  }

  function onChange(event) {
    var target = event.target;
    if (target.id === 'character-photo-input') {
      pickCharacterPhoto(target.files && target.files[0]);
      return;
    }
    var bind = target.getAttribute && target.getAttribute('data-bind');
    if (bind === 'playerName') {
      state.ui.playerNames[Number(target.getAttribute('data-index'))] = target.value;
    }
  }

  function onInput(event) {
    var target = event.target;
    var bind = target.getAttribute && target.getAttribute('data-bind');
    if (!bind) return;
    if (bind === 'gateCode') { state.ui.gateCode = target.value; state.ui.gateError = false; }
    else if (bind === 'questionText') state.ui.questionText = target.value;
    else if (bind === 'newIgnoreWord') state.ui.newIgnoreWord = target.value;
    else if (bind === 'characterName' && state.ui.characterForm) state.ui.characterForm.name = target.value;
    else if (bind === 'playerName') state.ui.playerNames[Number(target.getAttribute('data-index'))] = target.value;
  }

  function onKeydown(event) {
    if (event.key !== 'Enter') return;
    var target = event.target;
    if (target.id === 'gate-code-input') { event.preventDefault(); submitGate(); }
    else if (target.id === 'question-text-input') { event.preventDefault(); addQuestion(); }
    else if (target.id === 'ignore-word-input') { event.preventDefault(); addIgnoreWord(); }
    else if (target.id === 'guess-input') { event.preventDefault(); submitGuess(); }
  }

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------

  function init() {
    root = document.getElementById('app');
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    root.addEventListener('input', onInput);
    root.addEventListener('keydown', onKeydown);

    var startScreen = 'home';

    Store.getContent().then(function (saved) {
      state.content = saved || defaultContent();
      warmImageUrls(function () {
        state.screen = startScreen;
        render();
      });
    }).catch(function () {
      state.content = defaultContent();
      state.screen = startScreen;
      render();
    });
  }

  return { init: init, state: state };
})();

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.init);
  } else {
    App.init();
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = App;
}

</script>
</body>
</html>
